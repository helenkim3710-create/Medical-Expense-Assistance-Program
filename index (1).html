                      </>
                    ) : (
                      <div style={{ fontSize: 12.5, color: C.muted, lineHeight: 1.6 }}>
                        심의회의에서 지원금액이 결정되면 이곳에 표시되며, 적합 여부를 체크하실 수
                        있습니다.
                      </div>
                    )}
                  </div>

                  {/* 사회복지사 의견 */}
                  {r.swOpinion && (
                    <div style={{ marginTop: 13 }}>
                      <div style={{ fontSize: 11, fontWeight: 700, color: C.deep, marginBottom: 5 }}>
                        담당 사회복지사 의견
                      </div>
                      <div style={{ fontSize: 12.5, color: C.ink, lineHeight: 1.75 }}>
                        {r.swOpinion}
                      </div>
                    </div>
                  )}
                </div>

                <button
                  type="button"
                  onClick={() => setOpenId(open ? null : r.id)}
                  style={{
                    width: "100%",
                    padding: "9px 0",
                    fontSize: 12,
                    fontFamily: "inherit",
                    fontWeight: 600,
                    color: C.muted,
                    background: C.paper,
                    border: "none",
                    borderTop: `1px solid ${C.rule}`,
                    cursor: "pointer",
                  }}
                >
                  {open ? "접기 ▲" : "상세 자료 ▼"}
                </button>


                {open && <DocumentTabs row={r} />}
              </div>
              </React.Fragment>
            );
          })}
        </div>

        {targets.length > 0 && (
          <p style={{ fontSize: 11.5, color: C.muted, lineHeight: 1.7, marginTop: 20 }}>
            · 접수 상태인 건만 표시됩니다. 심의 회차는 상단에서 변경하실 수 있습니다.
            <br />· 지원금액은 심의회의 결정 후 사무국에서 입력하며, 입력되면 적합 여부를 체크하실
            수 있습니다.
          </p>
        )}
      </main>
    </div>
  );
}

/* ============================================================
   자문위원 — 의학부문 자문평가 소견서
   양식 출처: 의학자문평가_메일머지_양식.pdf
   ============================================================ */

const DEMO_ADVISORS = [
  { id: "advisor1", pw: "1234", name: "한정우", role: "의학자문위원", major: "혈액종양내과" },
  { id: "advisor2", pw: "1234", name: "오세림", role: "의학자문위원", major: "이식외과" },
];

const GRADE3 = [
  { v: "high", label: "① 높음" },
  { v: "mid", label: "② 보통" },
  { v: "low", label: "③ 낮음" },
];
const GRADE_LABEL = { high: "높음", mid: "보통", low: "낮음" };

function AdvisorPage({ rows, setRows }) {
  const [advisor, setAdvisor] = useState(null);
  const [form, setForm] = useState({ id: "", pw: "" });
  const [loginError, setLoginError] = useState("");
  const [session, setSession] = useState("2026-07");
  const [openId, setOpenId] = useState(null);
  const [docOpen, setDocOpen] = useState(null);

  const font = "'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif";

  const login = () => {
    const found = DEMO_ADVISORS.find(
      (a) => a.id === form.id.trim() && a.pw === form.pw.trim()
    );
    if (found) {
      setAdvisor(found);
      setLoginError("");
    } else {
      setLoginError("아이디 또는 비밀번호가 올바르지 않습니다.");
    }
  };

  /* 접수 건, 해당 회차 */
  const targets = rows.filter((r) => {
    if (r.status !== "received") return false;
    if (!r.submittedAt) return true;
    return r.submittedAt.slice(0, 7) === session;
  });

  /* 사업 구분별 그룹 */
  const groups = PROGRAMS.map((p) => ({
    ...p,
    items: targets.filter((r) => r.program === p.id).sort((a, b) => String(a.id).localeCompare(String(b.id))),
  })).filter((g) => g.items.length > 0);

  /* 내 평가 읽기/쓰기 */
  const myEval = (r) => (advisor && r.advice && r.advice[advisor.id]) || {};
  const setEval = (rowId, patch) => {
    if (!advisor) return;
    setRows((s) =>
      s.map((r) => {
        if (r.id !== rowId) return r;
        const advice = { ...(r.advice || {}) };
        advice[advisor.id] = { ...(advice[advisor.id] || {}), ...patch };
        return { ...r, advice };
      })
    );
  };

  /* 사업별 순위 중복 검사 */
  const rankConflicts = (programId) => {
    const g = groups.find((x) => x.id === programId);
    if (!g) return {};
    const seen = {};
    g.items.forEach((r) => {
      const rk = myEval(r).rank;
      if (!rk) return;
      seen[rk] = (seen[rk] || 0) + 1;
    });
    return seen;
  };

  const doneCount = targets.filter((r) => {
    const e = myEval(r);
    return e.reliability && e.daily && e.economic && e.opinion;
  }).length;

  /* --- 로그인 --- */
  if (!advisor) {
    return (
      <main style={{ maxWidth: 460, margin: "0 auto", padding: "50px 24px", fontFamily: font }}>
        <div
          style={{
            background: C.card,
            border: `1px solid ${C.rule}`,
            borderTop: `4px solid ${C.deep}`,
            borderRadius: 4,
            padding: "32px 30px",
          }}
        >
          <h2 style={{ fontSize: 19, fontWeight: 700, margin: "0 0 8px", color: C.ink }}>
            자문위원 로그인
          </h2>
          <p style={{ fontSize: 13, color: C.muted, lineHeight: 1.7, margin: "0 0 24px" }}>
            치료비 지원사업 의학부문 자문평가 소견서를 작성하실 수 있습니다.
          </p>
          <div style={{ display: "grid", gap: 14 }}>
            <Field label="아이디" required>
              <Input
                value={form.id}
                onChange={(e) => setForm((s) => ({ ...s, id: e.target.value }))}
                onKeyDown={(e) => e.key === "Enter" && login()}
              />
            </Field>
            <Field label="비밀번호" required>
              <Input
                type="password"
                value={form.pw}
                onChange={(e) => setForm((s) => ({ ...s, pw: e.target.value }))}
                onKeyDown={(e) => e.key === "Enter" && login()}
              />
            </Field>
          </div>
          {loginError && (
            <div style={{ fontSize: 12, color: C.seal, marginTop: 10 }}>{loginError}</div>
          )}
          <button
            type="button"
            onClick={login}
            style={{
              width: "100%",
              marginTop: 20,
              padding: "11px 0",
              fontSize: 14,
              fontWeight: 700,
              fontFamily: "inherit",
              color: "#fff",
              background: C.deep,
              border: "none",
              borderRadius: 3,
              cursor: "pointer",
            }}
          >
            로그인
          </button>
          <div
            style={{
              marginTop: 18,
              padding: "12px 14px",
              background: C.paper,
              border: `1px dashed ${C.rule}`,
              borderRadius: 3,
              fontSize: 11.5,
              lineHeight: 1.7,
              color: C.muted,
            }}
          >
            <strong style={{ color: C.ink }}>데모 계정</strong>
            <br />
            advisor1 / 1234 — 한정우 (혈액종양내과)
            <br />
            advisor2 / 1234 — 오세림 (이식외과)
          </div>
        </div>
      </main>
    );
  }

  /* --- 자문평가 --- */
  return (
    <div style={{ fontFamily: font, paddingBottom: 50 }}>
      <main style={{ maxWidth: 900, margin: "0 auto", padding: "26px 24px 0" }}>
        {/* 헤더 */}
        <div
          style={{
            display: "flex",
            alignItems: "center",
            justifyContent: "space-between",
            gap: 12,
            flexWrap: "wrap",
            padding: "14px 16px",
            background: C.deepSoft,
            border: `1px solid ${C.rule}`,
            borderRadius: 3,
            marginBottom: 18,
          }}
        >
          <div>
            <div style={{ fontSize: 15, fontWeight: 700, color: C.ink }}>
              {advisor.name}
              <span style={{ fontSize: 12, fontWeight: 400, color: C.muted, marginLeft: 8 }}>
                {advisor.role} · {advisor.major}
              </span>
            </div>
            <div style={{ fontSize: 12, color: C.muted, marginTop: 3 }}>
              의학부문 자문평가 · 작성 {doneCount} / {targets.length}건
            </div>
          </div>
          <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
            <Input
              type="month"
              value={session}
              onChange={(e) => setSession(e.target.value)}
              style={{ width: 150, padding: "6px 9px", fontSize: 13 }}
            />
            <button
              type="button"
              onClick={() => window.print()}
              style={{
                padding: "7px 14px",
                fontSize: 12,
                fontFamily: "inherit",
                fontWeight: 600,
                color: C.deep,
                background: C.card,
                border: `1px solid ${C.deep}`,
                borderRadius: 3,
                cursor: "pointer",
              }}
            >
              인쇄
            </button>
            <button
              type="button"
              onClick={() => {
                setAdvisor(null);
                setForm({ id: "", pw: "" });
              }}
              style={{
                padding: "7px 14px",
                fontSize: 12,
                fontFamily: "inherit",
                fontWeight: 600,
                color: C.muted,
                background: C.card,
                border: `1px solid ${C.rule}`,
                borderRadius: 3,
                cursor: "pointer",
              }}
            >
              로그아웃
            </button>
          </div>
        </div>

        <div
          style={{
            fontSize: 15,
            fontWeight: 700,
            color: C.ink,
            marginBottom: 4,
          }}
        >
          한마음한몸운동본부 치료비 지원사업 의학부문 자문평가 소견서
        </div>
        <div style={{ fontSize: 12.5, color: C.muted, marginBottom: 20 }}>
          {session.replace("-", "년 ")}월 · 총 {targets.length}건
        </div>

        {targets.length === 0 && (
          <p
            style={{
              fontSize: 13,
              color: C.muted,
              padding: "40px 20px",
              background: C.card,
              border: `1px dashed ${C.rule}`,
              borderRadius: 3,
              textAlign: "center",
            }}
          >
            이번 회차에 자문할 접수 건이 없습니다.
          </p>
        )}

        {/* 사업 구분별 그룹 */}
        {groups.map((g) => {
          const conflicts = rankConflicts(g.id);
          return (
            <div key={g.id} style={{ marginBottom: 28 }}>
              <div
                style={{
                  display: "flex",
                  alignItems: "center",
                  gap: 9,
                  paddingBottom: 7,
                  marginBottom: 12,
                  borderBottom: `2px solid ${g.color}`,
                }}
              >
                <span
                  style={{
                    fontSize: 11,
                    fontWeight: 700,
                    padding: "3px 9px",
                    borderRadius: 2,
                    color: "#fff",
                    background: g.color,
                  }}
                >
                  {g.short}
                </span>
                <span style={{ fontSize: 13, fontWeight: 700, color: C.ink }}>{g.label}</span>
                <span style={{ fontSize: 11.5, color: C.muted, marginLeft: "auto" }}>
                  총 {g.items.length}건 · 응급순위 부여
                </span>
              </div>

              <div style={{ display: "grid", gap: 14 }}>
                {g.items.map((r) => {
                  const e = myEval(r);
                  const open = openId === r.id;
                  const dOpen = docOpen === r.id;
                  const dupRank = e.rank && conflicts[e.rank] > 1;
                  const complete = e.reliability && e.daily && e.economic && e.opinion;

                  return (
                    <div
                      key={r.id}
                      style={{
                        background: C.card,
                        border: `1px solid ${complete ? "#C4DED0" : C.rule}`,
                        borderLeft: `4px solid ${g.color}`,
                        borderRadius: 3,
                        overflow: "hidden",
                      }}
                    >
                      {/* 1. 대상자 */}
                      <div style={{ padding: "16px 18px" }}>
                        <div
                          style={{
                            display: "flex",
                            alignItems: "center",
                            gap: 8,
                            flexWrap: "wrap",
                            marginBottom: 10,
                          }}
                        >
                          <span style={{ fontSize: 11.5, color: C.muted }}>
                            접수번호 <strong style={{ color: C.ink }}>{r.id}</strong>
                          </span>
                          {complete && (
                            <span
                              style={{
                                fontSize: 10.5,
                                fontWeight: 700,
                                padding: "2px 8px",
                                borderRadius: 2,
                                background: C.okSoft,
                                color: C.ok,
                              }}
                            >
                              작성 완료
                            </span>
                          )}
                          {e.rank && (
                            <span
                              style={{
                                fontSize: 10.5,
                                fontWeight: 700,
                                padding: "2px 8px",
                                borderRadius: 2,
                                background: dupRank ? C.sealSoft : C.deepSoft,
                                color: dupRank ? C.seal : C.deep,
                                marginLeft: "auto",
                              }}
                            >
                              {g.items.length}건 중 {e.rank}순위
                            </span>
                          )}
                        </div>

                        <div
                          style={{
                            display: "grid",
                            gridTemplateColumns: "repeat(auto-fit,minmax(130px,1fr))",
                            gap: 11,
                            padding: "13px 15px",
                            background: C.paper,
                            border: `1px solid ${C.rule}`,
                            borderRadius: 3,
                          }}
                        >
                          {[
                            ["성명", r.ptName],
                            ["생년월일", r.birth],
                            ["성별 / 나이", `${r.gender} / 만 ${age(r.birth)}세`],
                            ["진단명", r.diagnosis],
                            ["신청기관", r.hospital],
                          ].map(([k, val]) => (
                            <div key={k}>
                              <div style={{ fontSize: 10.5, color: C.muted, marginBottom: 2 }}>
                                {k}
                              </div>
                              <div style={{ fontSize: 12.5, fontWeight: 600, color: C.ink }}>
                                {val}
                              </div>
                            </div>
                          ))}
                        </div>

                        {/* 자료 확인 */}
                        <button
                          type="button"
                          onClick={() => setDocOpen(dOpen ? null : r.id)}
                          style={{
                            width: "100%",
                            marginTop: 10,
                            padding: "8px 0",
                            fontSize: 12,
                            fontFamily: "inherit",
                            fontWeight: 600,
                            color: C.deep,
                            background: C.card,
                            border: `1px solid ${C.deep}`,
                            borderRadius: 3,
                            cursor: "pointer",
                          }}
                        >
                          {dOpen ? "신청 자료 접기 ▲" : "신청서 · 추천서 · 첨부자료 보기 ▼"}
                        </button>
                      </div>

                      {dOpen && <DocumentTabs row={r} />}

                      {/* 평가사항 */}
                      <div
                        style={{
                          padding: "16px 18px",
                          borderTop: `1px solid ${C.rule}`,
                          background: C.paper,
                        }}
                      >
                        <div style={{ fontSize: 12, fontWeight: 700, color: C.deep, marginBottom: 12 }}>
                          평가사항
                        </div>

                        <div style={{ display: "grid", gap: 14 }}>
                          {/* 1. 자료 신뢰도 */}
                          <EvalRow
                            label="1. 자료 신뢰도"
                            value={e.reliability}
                            onChange={(v) => setEval(r.id, { reliability: v })}
                            note={e.reliabilityNote || ""}
                            onNote={(v) => setEval(r.id, { reliabilityNote: v })}
                          />

                          {/* 2. 회복 가능성 */}
                          <div>
                            <div style={{ fontSize: 12.5, fontWeight: 600, color: C.ink, marginBottom: 8 }}>
                              2. 회복 가능성
                            </div>
                            <div style={{ display: "grid", gap: 12, paddingLeft: 12 }}>
                              <EvalRow
                                label="1) 일상생활 가능"
                                value={e.daily}
                                onChange={(v) => setEval(r.id, { daily: v })}
                                note={e.dailyNote || ""}
                                onNote={(v) => setEval(r.id, { dailyNote: v })}
                                sub
                              />
                              <EvalRow
                                label="2) 경제생활 가능"
                                value={e.economic}
                                onChange={(v) => setEval(r.id, { economic: v })}
                                note={e.economicNote || ""}
                                onNote={(v) => setEval(r.id, { economicNote: v })}
                                sub
                              />
                            </div>
                          </div>

                          {/* 종합평가 */}
                          <div>
                            <div style={{ fontSize: 12.5, fontWeight: 600, color: C.ink, marginBottom: 6 }}>
                              종합평가 · 평가소견
                            </div>
                            <textarea
                              value={e.opinion || ""}
                              onChange={(ev) => setEval(r.id, { opinion: ev.target.value })}
                              rows={4}
                              placeholder="의학적 관점에서의 종합 소견을 작성해주세요."
                              style={{ ...inputStyle, resize: "vertical", lineHeight: 1.7 }}
                            />
                          </div>

                          {/* 응급순위 */}
                          <div>
                            <div style={{ fontSize: 12.5, fontWeight: 600, color: C.ink, marginBottom: 6 }}>
                              의학적 응급순위
                            </div>
                            <div
                              style={{
                                display: "flex",
                                alignItems: "center",
                                gap: 7,
                                flexWrap: "wrap",
                              }}
                            >
                              <span style={{ fontSize: 12.5, color: C.muted }}>
                                총 {g.items.length}건 중
                              </span>
                              <select
                                value={e.rank || ""}
                                onChange={(ev) => setEval(r.id, { rank: ev.target.value })}
                                style={{
                                  ...inputStyle,
                                  width: 90,
                                  padding: "6px 9px",
                                  borderColor: dupRank ? C.seal : C.rule,
                                }}
                              >
                                <option value="">선택</option>
                                {Array.from({ length: g.items.length }, (_, i) => i + 1).map((n) => (
                                  <option key={n} value={String(n)}>
                                    {n}순위
                                  </option>
                                ))}
                              </select>
                              <span style={{ fontSize: 11.5, color: C.muted }}>
                                ({g.short} 내 순위)
                              </span>
                            </div>
                            {dupRank && (
                              <div style={{ fontSize: 11.5, color: C.seal, marginTop: 5 }}>
                                같은 순위가 중복되었습니다. 확인해주세요.
                              </div>
                            )}
                          </div>

                          {/* 비고 */}
                          <div>
                            <div style={{ fontSize: 12.5, fontWeight: 600, color: C.ink, marginBottom: 6 }}>
                              비고
                            </div>
                            <textarea
                              value={e.note || ""}
                              onChange={(ev) => setEval(r.id, { note: ev.target.value })}
                              rows={2}
                              style={{ ...inputStyle, resize: "vertical", lineHeight: 1.7 }}
                            />
                          </div>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}

        {targets.length > 0 && (
          <div
            style={{
              marginTop: 24,
              padding: "18px 20px",
              background: C.card,
              border: `1px solid ${C.line}`,
              borderRadius: 3,
              textAlign: "center",
              lineHeight: 1.9,
            }}
          >
            <p style={{ fontSize: 13, color: C.ink, margin: "0 0 12px" }}>
              상기와 같이 의학부문 자문평가 소견을 제출합니다.
            </p>
            <p style={{ fontSize: 13, color: C.ink, margin: "0 0 12px" }}>
              {new Date().getFullYear()}년 {new Date().getMonth() + 1}월 {new Date().getDate()}일
            </p>
            <p style={{ fontSize: 13.5, fontWeight: 700, color: C.deep, margin: 0 }}>
              자문위원 {advisor.name} ({advisor.major})
            </p>
          </div>
        )}

        {targets.length > 0 && (
          <p style={{ fontSize: 11.5, color: C.muted, lineHeight: 1.7, marginTop: 16 }}>
            · 응급순위는 사업 구분별로 매깁니다. 같은 사업 안에서 중복되지 않도록 지정해주세요.
            <br />· 입력하신 내용은 자동으로 저장됩니다.
          </p>
        )}
      </main>
    </div>
  );
}

/* 3단계 평가 행 */
function EvalRow({ label, value, onChange, note, onNote, sub }) {
  return (
    <div>
      <div
        style={{
          display: "flex",
          alignItems: "center",
          gap: 12,
          flexWrap: "wrap",
          marginBottom: 6,
        }}
      >
        <span
          style={{
            fontSize: sub ? 12 : 12.5,
            fontWeight: sub ? 500 : 600,
            color: C.ink,
            minWidth: 118,
          }}
        >
          {label}
        </span>
        <div style={{ display: "flex", gap: 5 }}>
          {GRADE3.map((g) => {
            const on = value === g.v;
            return (
              <button
                key={g.v}
                type="button"
                onClick={() => onChange(on ? "" : g.v)}
                style={{
                  padding: "6px 13px",
                  fontSize: 12,
                  fontFamily: "inherit",
                  fontWeight: 600,
                  borderRadius: 3,
                  cursor: "pointer",
                  border: `1px solid ${on ? C.deep : C.rule}`,
                  background: on ? C.deep : C.card,
                  color: on ? "#fff" : C.muted,
                }}
              >
                {g.label}
              </button>
            );
          })}
        </div>
      </div>
      <input
        value={note}
        onChange={(e) => onNote(e.target.value)}
        placeholder="비고"
        style={{
          ...inputStyle,
          padding: "6px 10px",
          fontSize: 12,
          background: C.card,
        }}
      />
    </div>
  );
}

/* ============================================================
   화면 전환
   ============================================================ */
function App() {
  const [screen, setScreen] = useState("apply");
  const [rows, setRows] = useState(SAMPLE);
  const font = "'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif";

  return (
    <div style={{ minHeight: "100vh", background: C.paper, fontFamily: font, color: C.ink }}>
      {/* 상단 화면 전환 */}
      <div style={{ background: C.card, borderBottom: `1px solid ${C.rule}` }}>
        <div
          style={{
            maxWidth: screen === "admin" ? 1400 : screen === "committee" || screen === "advisor" || screen === "my" ? 900 : 840,
            margin: "0 auto",
            padding: "0 24px",
            display: "flex",
            gap: 4,
            overflowX: "auto",
          }}
        >
          {[
            { id: "apply", label: "치료비 지원신청" },
            { id: "my", label: "내 신청 내역" },
            { id: "report", label: "결과보고서 제출" },
            { id: "cert", label: "지원증서 전달" },
            { id: "ext", label: "연장계획서 제출" },
            { id: "advisor", label: "자문위원", admin: true },
            { id: "committee", label: "심의위원", admin: true },
            { id: "admin", label: "관리자", admin: true },
          ].map((t, ti, arr) => {
            const on = screen === t.id;
            const firstAdmin = t.admin && !arr[ti - 1]?.admin;
            return (
              <button
                key={t.id}
                type="button"
                onClick={() => setScreen(t.id)}
                style={{
                  padding: "14px 18px",
                  fontSize: 13.5,
                  fontWeight: on ? 700 : 500,
                  fontFamily: "inherit",
                  color: on ? (t.admin ? C.seal : C.deep) : C.muted,
                  background: "transparent",
                  border: "none",
                  borderBottom: `2px solid ${on ? (t.admin ? C.seal : C.deep) : "transparent"}`,
                  cursor: "pointer",
                  whiteSpace: "nowrap",
                  marginLeft: firstAdmin ? "auto" : 0,
                }}
              >
                {t.label}
              </button>
            );
          })}
        </div>
      </div>

      {screen === "apply" ? (
        <ApplyForm />
      ) : screen === "my" ? (
        <MyApplications />
      ) : screen === "report" ? (
        <ReportForm />
      ) : screen === "cert" ? (
        <CertificateForm />
      ) : screen === "ext" ? (
        <ExtensionForm />
      ) : screen === "advisor" ? (
        <AdvisorPage rows={rows} setRows={setRows} />
      ) : screen === "committee" ? (
        <CommitteePage rows={rows} setRows={setRows} />
      ) : (
        <AdminPage rows={rows} setRows={setRows} />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>

const inputStyle = {
  width: "100%",
  boxSizing: "border-box",
  padding: "8px 10px",
  fontSize: 14,
  fontFamily: "inherit",
  color: C.ink,
  background: C.card,
  border: `1px solid ${C.rule}`,
  borderRadius: 3,
  outline: "none",
};
const Input = (p) => <input {...p} style={{ ...inputStyle, ...p.style }} />;

function Field({ label, required, children, hint, wide, sub }) {
  return (
    <label style={{ display: "block", gridColumn: wide ? "1 / -1" : "auto" }}>
      <span
        style={{
          display: "block",
          fontSize: 12,
          fontWeight: 600,
          color: C.ink,
          marginBottom: 5,
        }}
      >
        {label}
        {required && <span style={{ color: C.seal, marginLeft: 3 }}>*</span>}
        {sub && (
          <span style={{ fontWeight: 400, color: C.muted, marginLeft: 6 }}>{sub}</span>
        )}
      </span>
      {children}
      {hint && (
        <span
          style={{
            display: "block",
            fontSize: 11,
            color: C.muted,
            marginTop: 4,
            lineHeight: 1.5,
          }}
        >
          {hint}
        </span>
      )}
    </label>
  );
}

function Section({ label, title, sub, children }) {
  return (
    <section style={{ marginBottom: 34 }}>
      <div
        style={{
          display: "flex",
          alignItems: "baseline",
          gap: 10,
          paddingBottom: 7,
          marginBottom: 16,
          borderBottom: `2px solid ${C.ink}`,
        }}
      >
        {label && (
          <span
            style={{
              fontSize: 10.5,
              fontWeight: 700,
              color: C.seal,
              letterSpacing: "0.12em",
            }}
          >
            {label}
          </span>
        )}
        <h2 style={{ fontSize: 16, fontWeight: 700, margin: 0, color: C.ink }}>{title}</h2>
        {sub && (
          <span style={{ fontSize: 11.5, color: C.muted, marginLeft: "auto" }}>{sub}</span>
        )}
      </div>
      {children}
    </section>
  );
}

const grid = (min = 200) => ({
  display: "grid",
  gridTemplateColumns: `repeat(auto-fit, minmax(${min}px, 1fr))`,
  gap: 14,
});

function Radio({ checked, onChange, children, name }) {
  return (
    <label
      style={{
        display: "inline-flex",
        alignItems: "center",
        gap: 6,
        fontSize: 13.5,
        cursor: "pointer",
        marginRight: 16,
        marginBottom: 4,
      }}
    >
      <input
        type="radio"
        name={name}
        checked={checked}
        onChange={onChange}
        style={{ accentColor: C.deep }}
      />
      {children}
    </label>
  );
}
function Check({ checked, onChange, children }) {
  return (
    <label
      style={{
        display: "inline-flex",
        alignItems: "center",
        gap: 6,
        fontSize: 13.5,
        cursor: "pointer",
        marginRight: 16,
        marginBottom: 4,
      }}

      <input
        type="checkbox"
        checked={checked}
        onChange={onChange}
        style={{ accentColor: C.deep }}
      />
      {children}
    </label>
  );
}

/* 소액 인라인 입력 (금액·숫자용) */
function Inline({ value, onChange, w = 110, suffix, ph, type = "text", invalid }) {
  return (
    <span style={{ display: "inline-flex", alignItems: "center", gap: 4, marginRight: 6 }}>
      <input
        type={type}
        value={value}
        onChange={onChange}
        placeholder={ph}
        data-invalid={invalid || undefined}
        style={{
          width: w,
          boxSizing: "border-box",
          padding: "5px 8px",
          fontSize: 13.5,
          fontFamily: "inherit",
          color: C.ink,
          background: C.card,
          border: `1px solid ${invalid ? C.seal : C.rule}`,
          borderRadius: 3,
          outline: "none",
          textAlign: suffix ? "right" : "left",
        }}
      />
      {suffix && <span style={{ fontSize: 13, color: C.muted }}>{suffix}</span>}
    </span>
  );
}

function DocSlot({ doc, file, onPick, onClear, showError }) {
  const ref = useRef(null);
  const missing = doc.required && !file && showError;
  return (
    <div
      style={{
        display: "flex",
        alignItems: "flex-start",
        gap: 11,
        padding: "11px 13px",
        background: file ? C.okSoft : C.card,
        border: `1px solid ${missing ? C.seal : file ? "#C4DED0" : C.rule}`,
        borderRadius: 3,
        marginBottom: 7,
      }}
    >
      <div
        style={{
          width: 17,
          height: 17,
          borderRadius: "50%",
          flexShrink: 0,
          marginTop: 1,
          background: file ? C.ok : "transparent",
          border: file ? "none" : `1.5px solid ${missing ? C.seal : C.rule}`,
          color: "#fff",
          fontSize: 10.5,
          lineHeight: "17px",
          textAlign: "center",
        }}
      >
        {file ? "✓" : ""}
      </div>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 13, fontWeight: 600, color: C.ink }}>
          {doc.name}
          <span
            style={{
              marginLeft: 7,
              fontSize: 10,
              fontWeight: 600,
              padding: "1px 6px",
              borderRadius: 2,
              background: doc.required ? C.sealSoft : "#EEEDE9",
              color: doc.required ? C.seal : C.muted,
            }}
          >
            {doc.required ? "필수" : "선택"}
          </span>
        </div>
        {doc.note && (
          <div style={{ fontSize: 11, color: C.muted, marginTop: 2 }}>{doc.note}</div>
        )}
        {file && (
          <div style={{ fontSize: 11, color: C.ok, marginTop: 4, wordBreak: "break-all" }}>
            {file.name} · {(file.size / 1024).toFixed(0)}KB
          </div>
        )}
        {missing && (
          <div style={{ fontSize: 11, color: C.seal, marginTop: 4 }}>첨부가 필요합니다.</div>
        )}
      </div>
      <input
        ref={ref}
        type="file"
        style={{ display: "none" }}
        onChange={(e) => e.target.files?.[0] && onPick(e.target.files[0])}
      />
      <button
        type="button"
        onClick={() => (file ? onClear() : ref.current?.click())}
        style={{
          flexShrink: 0,
          padding: "5px 11px",
          fontSize: 11.5,
          fontFamily: "inherit",
          fontWeight: 600,
          cursor: "pointer",
          borderRadius: 3,
          border: `1px solid ${file ? C.rule : C.deep}`,
          background: file ? C.card : C.deep,
          color: file ? C.muted : "#fff",
        }}
      >
        {file ? "삭제" : "첨부"}
      </button>
    </div>
  );
}

const emptyFamily = () => ({
  rel: "", name: "", age: "", job: "", live: "", income: "", note: "",
});

function ApplyForm() {
  const [f, setF] = useState({
    type: "",
    separated: false,
    receiptNo: "",

    /* 환자 정보 */
    ptName: "", ptGender: "", ptBirth: "", ptNationality: "", ptAge: "",
    diagnosis: "", diagDate: "", hospital: "", address: "", phone: "",
    ptResidence: "",

    /* 경제적 상황 */
    incomeAmt: "", householdN: "",
    housing: "", hOwn: "", hJeonse: "", hWolseDep: "", hWolseMon: "", hEtc: "",
    propReal: "", propCash: "",
    debtYN: "", debtAmt: "", debtUse: "",
    privIns: "",
    welfare: "", basicSubsidy: "",
    medical: "",
    disability: "",

    /* 치료비 현황 */
    costA: "", costAFrom: "", costATo: "",
    costB: "", costBFrom: "", costBTo: "", costBDetail: "",
    costD: "", costDDetail: "",
    treatPlan: "",

    /* 후원내역 */
    sponsorOrg: "", sponsorAmt: "", sponsorFrom: "", sponsorTo: "",

    /* 확약 (기관명/담당자) */
    orgName: "", orgStaff: "",

    /* 추천서 (담당 사회복지사 작성) */
    recIncome120: false,
    recAsset: "",
    swName: "", swDept: "", swPhone: "", swEmail: "",
    swZip: "", swAddress: "",
    recMedical: "", recSocial: "", recOpinion: "",

    /* 동의 */
    agreePrivacy: false, agreeSensitive: false, agreeTrue: false,
  });

  const [family, setFamily] = useState([emptyFamily()]);
  const [files, setFiles] = useState({});
  const [showError, setShowError] = useState(false);
  const [submitted, setSubmitted] = useState(false);
  const [page, setPage] = useState(1);

  const set = (k) => (e) => {
    const v = e.target.type === "checkbox" ? e.target.checked : e.target.value;
    setF((s) => ({ ...s, [k]: v }));
  };
  const put = (k, v) => setF((s) => ({ ...s, [k]: v }));

  const chooseType = (id) => {
    setF((s) => ({ ...s, type: id }));
    setFiles({});
  };

  const isForeign = f.type === "foreign";
  const typeMeta = APPLICANT_TYPES.find((t) => t.id === f.type);

  /* 치료비 자동 계산 */
  const A = Number(f.costA) || 0;
  const B = Number(f.costB) || 0;
  const D = Number(f.costD) || 0;
  const totalC = A + B;
  const request = totalC - D;

  /* 가족 행 */
  const addFamily = () => setFamily((r) => [...r, emptyFamily()]);
  const delFamily = (i) => setFamily((r) => r.filter((_, x) => x !== i));
  const setFam = (i, k) => (e) =>
    setFamily((r) => r.map((row, x) => (x === i ? { ...row, [k]: e.target.value } : row)));

  /* 서류 그룹 */
  const docGroups = useMemo(() => {
    if (!f.type) return [];
    const docs = DOCS_BY_TYPE[f.type] || [];
    return [{ title: `제출 서류 · ${typeMeta?.label}`, docs }];
  }, [f.type, typeMeta]);

  const allDocs = useMemo(() => docGroups.flatMap((g) => g.docs), [docGroups]);

  /* 페이지별 필수 입력 */
  const PAGE1_FIELDS = useMemo(() => {
    const base = [
      "type", "ptName", "ptGender", "ptBirth", "diagnosis", "diagDate",
      "hospital", "address", "phone", "incomeAmt", "householdN", "treatPlan",
    ];
    if (isForeign) base.push("ptNationality", "ptResidence");
    return base;
  }, [isForeign]);
  const PAGE2_FIELDS = ["orgName", "orgStaff"];

  const requiredFields = useMemo(
    () => [...PAGE1_FIELDS, ...PAGE2_FIELDS],
    [PAGE1_FIELDS]
  );

  const missingFields = requiredFields.filter((k) => !String(f[k] || "").trim());
  const missingDocs = allDocs.filter((d) => d.required && !files[d.id]);
  const agreed = true;
  const canSubmit =
    f.type && missingFields.length === 0 && missingDocs.length === 0;

  /* 현재 페이지 검증 */
  const FIELD_LABELS = {
    type: "신청 유형", ptName: "환자명", ptGender: "성별", ptBirth: "생년월일",
    ptNationality: "국적", ptResidence: "체류 자격", diagnosis: "진단명",
    diagDate: "진단일", hospital: "진료병원", address: "주소", phone: "연락처",
    incomeAmt: "월가구 소득", householdN: "가구원 수", treatPlan: "향후 치료 계획",
    orgName: "기관명", orgStaff: "담당자",
  };
  const missingOn = (p) => {
    const list = p === 1 ? PAGE1_FIELDS : p === 2 ? PAGE2_FIELDS : [];
    return list.filter((k) => !String(f[k] || "").trim());
  };

  const totalReq = allDocs.filter((d) => d.required).length;
  const gotReq = allDocs.filter((d) => d.required && files[d.id]).length;
  const progress = totalReq ? (gotReq / totalReq) * 100 : 0;

  /* 확약 날짜 — 제출일(오늘) 자동 */
  const _now = new Date();
  const todayY = _now.getFullYear();
  const todayM = _now.getMonth() + 1;
  const todayD = _now.getDate();

  const err = (k) => showError && !String(f[k] || "").trim();
  const eb = (k) => (err(k) ? { borderColor: C.seal } : {});

  const pick = (id) => (file) => setFiles((s) => ({ ...s, [id]: file }));
  const clear = (id) => () =>
    setFiles((s) => {

/* 자동 계산 행 */
function CalcRow({ label, value, strong, warn, warnMsg }) {
  return (
    <div>
      <div
        style={{
          display: "flex",
          justifyContent: "space-between",
          alignItems: "center",
          padding: "12px 15px",
          background: strong ? C.deepSoft : "#F1EFEA",
          border: `1px solid ${strong ? C.deep : C.rule}`,
          borderRadius: 3,
        }}
      >
        <span style={{ fontSize: 13, fontWeight: strong ? 700 : 600, color: C.ink }}>{label}</span>
        <span style={{ fontSize: strong ? 16 : 14, fontWeight: 700, color: strong ? C.deep : C.ink }}>
          {value} <span style={{ fontSize: 12, fontWeight: 400, color: C.muted }}>원</span>
        </span>
      </div>
      {warn && warnMsg && (
        <div style={{ fontSize: 11.5, color: C.seal, marginTop: 4 }}>{warnMsg}</div>
      )}
    </div>
  );
}

const emptySettle = () => ({ date: "", amount: "", receiptNo: "", note: "" });

    /* 환우 정보 */

    /* 금액 */
    grantAmount: "", usedAmount: "", refundAmount: "", refundDate: "",
    /* 사용기간 */
    useFrom: "", useTo: "",
    /* 서술 */
    treatContent: "", swOpinion: "",
    /* 작성자 */
    swName: "",
  });
  const [settle, setSettle] = useState([emptySettle()]);
  const [useSettle, setUseSettle] = useState(false);
  const [files, setFiles] = useState({});
  const [showError, setShowError] = useState(false);

  const set = (k) => (e) => setR((s) => ({ ...s, [k]: e.target.value }));
  const put = (k, v) => setR((s) => ({ ...s, [k]: v }));
  const setL = (k) => (e) => setLookup((s) => ({ ...s, [k]: e.target.value }));

  /* 정산내역 */
  const addRow = () => setSettle((s) => [...s, emptySettle()]);
  const delRow = (i) => setSettle((s) => s.filter((_, x) => x !== i));
  const setRow = (i, k) => (e) =>
    setSettle((s) => s.map((row, x) => (x === i ? { ...row, [k]: e.target.value } : row)));
  const settleTotal = settle.reduce((sum, row) => sum + (Number(row.amount) || 0), 0);

  const required = [
    "ptName", "ptGender", "ptBirth", "hospital", "dept", "diagnosis",
    "applyDate", "grantAmount", "usedAmount", "useFrom", "useTo",
    "treatContent", "swOpinion", "swName",
  ];
  const missing = required.filter((k) => !String(r[k] || "").trim());
  const missingDocs = REPORT_DOCS.filter((d) => d.required && !files[d.id]);
  const canSubmit = missing.length === 0 && missingDocs.length === 0;

  const err = (k) => showError && !String(r[k] || "").trim();

            <br />
            문의: 02-727-2485 · 3042@ohob.or.kr
          </p>
        </div>
      </div>

              <Input value={c.swName} onChange={set("swName")} data-invalid={err("swName")} style={eb("swName")} />
            </Field>
            <Field label="담당 사회복지사 (전화)" required>
              <Input value={c.swPhone} onChange={set("swPhone")} data-invalid={err("swPhone")} style={eb("swPhone")} />
            </Field>
          </div>
        </Section>

        {/* 02 전달식 */}
        <Section label="02" title="전달식 진행">
          <div style={grid(200)}>
            <Field label="전달식 일자" required>
              <Input
                type="date"
                value={c.eventDate}
                onChange={set("eventDate")}
                data-invalid={err("eventDate")}
                style={eb("eventDate")}
              />
            </Field>
            <Field label="전달식 시간">
              <Input type="time" value={c.eventTime} onChange={set("eventTime")} />
            </Field>
            <Field label="장소" required>
              <Input value={c.place} onChange={set("place")} data-invalid={err("place")} style={eb("place")} />
            </Field>
            <Field label="참석자" required wide hint="직함과 이름을 함께 적어주세요.">
              <Input value={c.attendees} onChange={set("attendees")} data-invalid={err("attendees")} style={eb("attendees")} />
            </Field>
            <Field
              label="내용"
              required
              wide
              hint="증서 전달식 진행내용 / 치료비 지원 후 환자 근황 / 환자의 감사인사 등"
            >
              <textarea
                value={c.content}
                onChange={set("content")}
                rows={8}
                data-invalid={err("content")}
                style={{ ...inputStyle, resize: "vertical", lineHeight: 1.7, ...eb("content") }}
              />
            </Field>
          </div>
        </Section>

        {/* 03 첨부 */}
        <Section label="03" title="첨부">
          {CERT_DOCS.map((d) => (
            <DocSlot
              key={d.id}
              doc={d}
              file={files[d.id]}
              showError={showError}
              onPick={pick(d.id)}
              onClear={clear(d.id)}
            />
          ))}
          <div
            style={{
              marginTop: 12,
              padding: "15px 17px",
              background: C.sealSoft,
              border: `1px solid ${C.rule}`,
              borderRadius: 3,
              fontSize: 12.5,
              lineHeight: 1.8,
              color: C.seal,
            }}
          >
            본부 홍보활동(홈페이지 등)에 필요 시 '개인정보 수집·이용동의서' 중 초상 수집 및 이용에
            동의해 주신 경우에 한해 사연과 사진이 공개되며, 공개 시에는 가명, 얼굴 모자이크 처리 후
            진행될 예정입니다.
          </div>
        </Section>

        {/* 04 보고 */}
        <Section label="04" title="보고">
          <div
            style={{
              padding: "22px 24px",
              background: C.card,
              border: `1px solid ${C.line}`,
              borderRadius: 3,
              textAlign: "center",
              lineHeight: 1.9,
            }}
          >
            <p style={{ fontSize: 13.5, color: C.ink, margin: "0 0 18px" }}>
              상기와 같이 한마음한몸운동본부 치료비 지원증서 전달 상황을 보고합니다.
            </p>
            <p style={{ fontSize: 13, color: C.ink, margin: "0 0 18px" }}>
              {now.getFullYear()}년 {now.getMonth() + 1}월 {now.getDate()}일
              <span style={{ fontSize: 11, color: C.muted, marginLeft: 8 }}>
                (제출일 기준 자동 입력)
              </span>
            </p>
            <p style={{ fontSize: 14, fontWeight: 700, color: C.deep, margin: 0 }}>
              재단법인 천주교한마음한몸운동본부 귀중
            </p>
          </div>
        </Section>
      </main>

      <div
        style={{
          position: "fixed",
          bottom: 0,
          left: 0,
          right: 0,
          background: C.card,
          borderTop: `1px solid ${C.rule}`,
          padding: "13px 24px",
          boxShadow: "0 -2px 12px rgba(0,0,0,0.06)",
        }}
      >
        <div
          style={{
            maxWidth: 840,
            margin: "0 auto",
            display: "flex",
            alignItems: "center",
            gap: 14,
            flexWrap: "wrap",
          }}
        >
          <div
            style={{
              flex: 1,
              minWidth: 160,
              fontSize: 12,
              color: showError && !canSubmit ? C.seal : C.muted,
            }}
          >
            {canSubmit ? (
              <span style={{ color: C.ok, fontWeight: 600 }}>제출할 수 있습니다.</span>
            ) : (
              <>
                미입력 {missing.length}개 · 미첨부 {missingDocs.length}개
              </>
            )}
          </div>
          <button
            type="button"
            onClick={submit}
            style={{
              padding: "10px 30px",
              fontSize: 14,
              fontWeight: 700,
              fontFamily: "inherit",
              color: "#fff",
              background: canSubmit ? C.deep : "#A9B4B8",
              border: "none",
              borderRadius: 3,
              cursor: "pointer",
            }}
          >
            진행상황 제출
          </button>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   중간보고 및 연장계획서 — 양식 원문 기준
   출처: _양식_치료비_지원_중간보고_및_연장계획서.pdf
   ============================================================ */
const EXT_DOCS = [{ id: "x1", name: "영수증", required: true }];

const emptyExtRow = () => ({ date: "", amount: "", receiptNo: "", note: "" });

function ExtensionForm() {
  const [done, setDone] = useState(false);
  const [showError, setShowError] = useState(false);
  const [files, setFiles] = useState({});
  const [rows, setRows] = useState([emptyExtRow()]);
  const [useSettle, setUseSettle] = useState(false);
  const [x, setX] = useState({
    ptName: "", ptGender: "", ptBirth: "",
    hospital: "", diagnosis: "",
    applyPeriod: "",
    grantAmount: "", usedAmount: "",
    planFrom: "", planTo: "",
    extFrom: "", extTo: "",
    usageDetail: "",
    futurePlan: "",
    swName: "",
  });

  const set = (k) => (e) => setX((s) => ({ ...s, [k]: e.target.value }));
  const put = (k, v) => setX((s) => ({ ...s, [k]: v }));

  const A = Number(x.grantAmount) || 0;
  const B = Number(x.usedAmount) || 0;
  const balance = A - B;

  const addRow = () => setRows((s) => [...s, emptyExtRow()]);
  const delRow = (i) => setRows((s) => s.filter((_, n) => n !== i));
  const setRow = (i, k) => (e) =>
    setRows((s) => s.map((row, n) => (n === i ? { ...row, [k]: e.target.value } : row)));
  const rowTotal = rows.reduce((sum, row) => sum + (Number(row.amount) || 0), 0);

  const required = [
    "ptName", "ptGender", "ptBirth", "hospital", "diagnosis", "applyPeriod",
    "grantAmount", "usedAmount", "planFrom", "planTo", "extFrom", "extTo",
    "usageDetail", "futurePlan", "swName",
  ];
  const missing = required.filter((k) => !String(x[k] || "").trim());
  const missingDocs = EXT_DOCS.filter((d) => d.required && !files[d.id]);
  const canSubmit = missing.length === 0 && missingDocs.length === 0;

  const err = (k) => showError && !String(x[k] || "").trim();
  const eb = (k) => (err(k) ? { borderColor: C.seal } : {});

  const pick = (id) => (file) => setFiles((s) => ({ ...s, [id]: file }));
  const clear = (id) => () =>
    setFiles((s) => {
      const n = { ...s };
      delete n[id];
      return n;
    });

  const now = new Date();
  const font = "'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif";

  const submit = () => {
    setShowError(true);
    if (canSubmit) {
      setDone(true);
      window.scrollTo({ top: 0, behavior: "smooth" });
    } else {
      setTimeout(() => {
        document
          .querySelector("[data-invalid='true']")
          ?.scrollIntoView({ behavior: "smooth", block: "center" });
      }, 40);
    }
  };

  const cellInput = {
    width: "100%",
    boxSizing: "border-box",
    padding: "7px 8px",
    fontSize: 12.5,
    fontFamily: "inherit",
    border: "none",
    outline: "none",
    background: "transparent",
    color: C.ink,
  };

  if (done) {
    return (
      <div
        style={{
          minHeight: "60vh",
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          padding: 24,
          fontFamily: font,
        }}
      >
        <div
          style={{
            maxWidth: 460,
            background: C.card,
            border: `1px solid ${C.rule}`,
            borderTop: `4px solid ${C.deep}`,
            borderRadius: 4,
            padding: "38px 34px",
            textAlign: "center",
          }}
        >
          <div style={{ fontSize: 30, marginBottom: 12 }}>✓</div>
          <h1 style={{ fontSize: 19, margin: "0 0 12px", color: C.ink }}>
            중간보고 및 연장계획서가 제출되었습니다
          </h1>
          <p style={{ fontSize: 13, color: C.muted, lineHeight: 1.7, margin: 0 }}>
            제출일 {now.getFullYear()}년 {now.getMonth() + 1}월 {now.getDate()}일
            <br />
            문의: 02-727-2485 · 3042@ohob.or.kr
          </p>
        </div>
      </div>
    );
  }

  return (
    <div style={{ fontFamily: font, paddingBottom: 90 }}>
      <main style={{ maxWidth: 840, margin: "0 auto", padding: "28px 24px 0" }}>
        <div
          style={{
            padding: "13px 16px",
            background: C.deepSoft,
            border: `1px solid ${C.rule}`,
            borderRadius: 3,
            marginBottom: 26,
            fontSize: 12.5,
            lineHeight: 1.7,
            color: C.ink,
          }}
        >
          <strong>치료비 지원 중간보고 및 연장계획서</strong>
          <br />
          지원금 사용기한 연장이 필요한 경우, 중간 결과와 향후 계획을 함께 제출합니다.
        </div>

        {/* 01 환자 정보 */}
        <Section label="01" title="환자 정보">
          <div style={grid(200)}>
            <Field label="환자명" required>
              <Input value={x.ptName} onChange={set("ptName")} data-invalid={err("ptName")} style={eb("ptName")} />
            </Field>
            <Field label="성별" required>
              <div style={{ paddingTop: 6 }}>
                <Radio name="xg" checked={x.ptGender === "남"} onChange={() => put("ptGender", "남")}>남</Radio>
                <Radio name="xg" checked={x.ptGender === "여"} onChange={() => put("ptGender", "여")}>여</Radio>
              </div>
            </Field>
            <Field label="생년월일" required>
              <Input type="date" value={x.ptBirth} onChange={set("ptBirth")} data-invalid={err("ptBirth")} style={eb("ptBirth")} />
            </Field>
            <Field label="진료병원" required>
              <Input value={x.hospital} onChange={set("hospital")} data-invalid={err("hospital")} style={eb("hospital")} />
            </Field>
            <Field label="진단명" required>
              <Input value={x.diagnosis} onChange={set("diagnosis")} data-invalid={err("diagnosis")} style={eb("diagnosis")} />
            </Field>
            <Field label="지원 신청시기" required hint="예: 2025년 3월">
              <Input value={x.applyPeriod} onChange={set("applyPeriod")} data-invalid={err("applyPeriod")} style={eb("applyPeriod")} />
            </Field>
          </div>
        </Section>

        {/* 02 지원금 현황 */}
        <Section label="02" title="지원금 현황" sub="잔액은 자동 계산됩니다">
          <div style={{ display: "grid", gap: 10 }}>
            <div
              style={{
                display: "flex",
                justifyContent: "space-between",
                alignItems: "center",
                padding: "12px 15px",
                background: C.card,
                border: `1px solid ${C.rule}`,
                borderRadius: 3,
              }}
            >
              <span style={{ fontSize: 13, fontWeight: 600 }}>지원결정액 (A)</span>
              <Inline
                value={x.grantAmount}
                onChange={set("grantAmount")}
                suffix="원"
                w={150}
                type="number"
                invalid={err("grantAmount")}
              />
            </div>
            <div
              style={{
                display: "flex",
                justifyContent: "space-between",
                alignItems: "center",
                padding: "12px 15px",
                background: C.card,
                border: `1px solid ${C.rule}`,
                borderRadius: 3,
              }}
            >
              <span style={{ fontSize: 13, fontWeight: 600 }}>현재 사용액 (B)</span>
              <Inline
                value={x.usedAmount}
                onChange={set("usedAmount")}
                suffix="원"
                w={150}
                type="number"
                invalid={err("usedAmount")}
              />
            </div>
            <div
              style={{
                display: "flex",
                justifyContent: "space-between",
                alignItems: "center",
                padding: "13px 15px",
                background: C.deepSoft,
                border: `1px solid ${C.deep}`,
                borderRadius: 3,
              }}
            >
              <span style={{ fontSize: 13, fontWeight: 700 }}>잔액 (A − B)</span>
              <span style={{ fontSize: 16, fontWeight: 700, color: C.deep }}>
                {won(balance)}{" "}
                <span style={{ fontSize: 12, fontWeight: 400, color: C.muted }}>원</span>
              </span>
            </div>
          </div>
        </Section>

        {/* 03 사용기한 */}
        <Section label="03" title="사용기한">
          <div style={{ display: "grid", gap: 14 }}>
            <Field label="기존 계획기한" required>
              <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                <Input
                  type="date"
                  value={x.planFrom}
                  onChange={set("planFrom")}
                  data-invalid={err("planFrom")}
                  style={{ width: 168, padding: "6px 9px", fontSize: 13.5, ...eb("planFrom") }}
                />
                <span style={{ color: C.muted }}>~</span>
                <Input
                  type="date"
                  value={x.planTo}
                  onChange={set("planTo")}
                  data-invalid={err("planTo")}
                  style={{ width: 168, padding: "6px 9px", fontSize: 13.5, ...eb("planTo") }}
                />
              </div>
            </Field>
            <Field label="연장 요청기한" required>
              <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                <Input
                  type="date"
                  value={x.extFrom}
                  onChange={set("extFrom")}
                  data-invalid={err("extFrom")}
                  style={{ width: 168, padding: "6px 9px", fontSize: 13.5, ...eb("extFrom") }}
                />
                <span style={{ color: C.muted }}>~</span>
                <Input
                  type="date"
                  value={x.extTo}
                  onChange={set("extTo")}
                  data-invalid={err("extTo")}
                  style={{ width: 168, padding: "6px 9px", fontSize: 13.5, ...eb("extTo") }}
                />
              </div>
            </Field>
          </div>
        </Section>

        {/* 04 서술 */}
        <Section label="04" title="중간보고 및 향후 계획">
          <div style={{ display: "grid", gap: 14 }}>
            <Field
              label="현재까지의 지원금 사용내역 (치료 내용)"
              required
            >
              <textarea
                value={x.usageDetail}
                onChange={set("usageDetail")}
                rows={7}
                data-invalid={err("usageDetail")}
                style={{ ...inputStyle, resize: "vertical", lineHeight: 1.7, ...eb("usageDetail") }}
              />
            </Field>
            <Field
              label="향후 치료 계획 및 기타 사회복지사 소견"
              required
              hint="연장 사유 및 치료비 계획을 함께 적어주세요."
            >
              <textarea
                value={x.futurePlan}
                onChange={set("futurePlan")}
                rows={8}
                data-invalid={err("futurePlan")}
                style={{ ...inputStyle, resize: "vertical", lineHeight: 1.7, ...eb("futurePlan") }}
              />
            </Field>
          </div>
        </Section>

        {/* 05 정산내역 */}
        <Section label="05" title="치료비 지원금 정산내역" sub="영수증 2장 이상인 경우 작성">
          <label
            style={{
              display: "inline-flex",
              alignItems: "flex-start",
              gap: 9,
              fontSize: 13,
              cursor: "pointer",
              lineHeight: 1.5,
              marginBottom: 14,
            }}
          >
            <input
              type="checkbox"
              checked={useSettle}
              onChange={(e) => setUseSettle(e.target.checked)}
              style={{ marginTop: 2, accentColor: C.deep }}
            />
            <span>
              집행 관련 영수증이 2장 이상입니다
              <span style={{ color: C.muted, fontSize: 12, display: "block" }}>
                체크하면 정산내역 표가 나타납니다. 지원대상자 개인별로 작성해주세요.
              </span>
            </span>
          </label>

          {useSettle && (
            <>
              <div style={{ overflowX: "auto" }}>
                <table
                  style={{
                    width: "100%",
                    borderCollapse: "collapse",
                    fontSize: 12.5,
                    minWidth: 620,
                  }}
                >
                  <thead>
                    <tr style={{ background: C.deepSoft }}>
                      {["번호", "사용일", "사용금액(원)", "영수증 번호", "비고", ""].map((h) => (
                        <th
                          key={h}
                          style={{
                            padding: "8px",
                            textAlign: "left",
                            fontWeight: 600,
                            color: C.ink,
                            border: `1px solid ${C.rule}`,
                            whiteSpace: "nowrap",
                          }}
                        >
                          {h}
                        </th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {rows.map((row, i) => (
                      <tr key={i}>
                        <td
                          style={{
                            border: `1px solid ${C.rule}`,
                            padding: "7px 8px",
                            textAlign: "center",
                            width: 44,
                            color: C.muted,
                          }}
                        >
                          {i + 1}
                        </td>
                        <td style={{ border: `1px solid ${C.rule}`, padding: 0, width: 150 }}>
                          <input type="date" value={row.date} onChange={setRow(i, "date")} style={cellInput} />
                        </td>
                        <td style={{ border: `1px solid ${C.rule}`, padding: 0 }}>
                          <input
                            type="number"
                            value={row.amount}
                            onChange={setRow(i, "amount")}
                            style={{ ...cellInput, textAlign: "right" }}
                          />
                        </td>
                        <td style={{ border: `1px solid ${C.rule}`, padding: 0 }}>
                          <input value={row.receiptNo} onChange={setRow(i, "receiptNo")} style={cellInput} />
                        </td>
                        <td style={{ border: `1px solid ${C.rule}`, padding: 0 }}>
                          <input
                            value={row.note}
                            onChange={setRow(i, "note")}
                            placeholder="예: 1차 중간결과보고 제출 건"
                            style={cellInput}
                          />
                        </td>
                        <td style={{ border: `1px solid ${C.rule}`, textAlign: "center", width: 34 }}>
                          <button
                            type="button"
                            onClick={() => delRow(i)}
                            disabled={rows.length === 1}
                            style={{
                              border: "none",
                              background: "transparent",
                              color: rows.length === 1 ? C.rule : C.seal,
                              cursor: rows.length === 1 ? "default" : "pointer",
                              fontSize: 15,
                            }}
                          >
                            ×
                          </button>
                        </td>
                      </tr>
                    ))}
                    <tr style={{ background: "#F1EFEA" }}>
                      <td
                        colSpan={2}
                        style={{
                          border: `1px solid ${C.rule}`,
                          padding: "9px 8px",
                          fontWeight: 700,
                          textAlign: "center",
                        }}
                      >
                        합계
                      </td>
                      <td
                        style={{
                          border: `1px solid ${C.rule}`,
                          padding: "9px 8px",
                          fontWeight: 700,
                          textAlign: "right",
                        }}
                      >
                        {won(rowTotal)}
                      </td>
                      <td style={{ border: `1px solid ${C.rule}` }} colSpan={3} />
                    </tr>
                  </tbody>
                </table>
              </div>

              <button
                type="button"
                onClick={addRow}
                style={{
                  marginTop: 10,
                  padding: "7px 14px",
                  fontSize: 12.5,
                  fontFamily: "inherit",
                  fontWeight: 600,
                  color: C.deep,
                  background: C.card,
                  border: `1px solid ${C.deep}`,
                  borderRadius: 3,
                  cursor: "pointer",
                }}
              >
                + 행 추가
              </button>

              <div
                style={{
                  marginTop: 16,
                  padding: "14px 16px",
                  background: C.sealSoft,
                  border: `1px solid ${C.rule}`,
                  borderRadius: 3,
                  fontSize: 11.5,
                  lineHeight: 1.75,
                  color: C.seal,
                }}
              >

                경우, 정산내역서는 대상자별로 각 1장씩 작성합니다.

/* ---------- 문서 생성 · 다운로드 ---------- */
function downloadHTML(filename, title, bodyHTML) {
  const html = `<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>${title}</title>
<style>
  body{font-family:'Malgun Gothic','맑은 고딕',sans-serif;font-size:13px;color:#1B2A33;
       max-width:760px;margin:28px auto;padding:0 24px;line-height:1.7;}
  h1{font-size:19px;text-align:center;margin:0 0 4px;}
  .sub{text-align:center;color:#6E7A80;font-size:12px;margin-bottom:22px;}
  h2{font-size:13px;color:#2C5F6B;border-bottom:2px solid #2C5F6B;
     padding-bottom:5px;margin:22px 0 10px;}
  table{width:100%;border-collapse:collapse;margin-bottom:6px;font-size:12.5px;}
  th,td{border:1px solid #C6BFB1;padding:7px 9px;text-align:left;vertical-align:top;}
  th{background:#EDEAE3;font-weight:600;width:26%;}
  td.num{text-align:right;}
  .memo{border:1px solid #C6BFB1;padding:11px 13px;white-space:pre-line;min-height:44px;}
  .sign{text-align:center;margin-top:34px;line-height:2.1;}
  .sign strong{font-size:14px;color:#2C5F6B;}
  @media print{body{margin:0;}@page{margin:16mm;}}
</style></head><body>${bodyHTML}</body></html>`;
  const blob = new Blob(["\ufeff", html], { type: "text/html;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* 결과보고서 제출 안내 대상 여부: 사용기간 종료 60일 이내 & 미제출 */
function reportDueInfo(r) {
  if (!GRANTED.includes(r.status)) return null;
  if (r.reportDate) return null;
  const p = calcPeriod(r.reviewYM);
  if (!p) return null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const daysLeft = Math.ceil((p.endDate - today) / 86400000);
  if (daysLeft > 60) return null; // 아직 2달 이상 남음
  return { period: p, daysLeft };
}

const PROGRAM_ORDER = PROGRAMS.reduce((a, p, i) => ({ ...a, [p.id]: i }), {});
const byProgram = (a, b) => {
  const pa = PROGRAM_ORDER[a.program] ?? 99;
  const pb = PROGRAM_ORDER[b.program] ?? 99;
  if (pa !== pb) return pa - pb;
  return String(a.id).localeCompare(String(b.id));
};

/* 접수번호 자동생성 — 구분+년도(2자리)-순번(2자리) 예: 백난26-01 */
function makeReceiptNo(programId, year, rows) {
  const prefix = PROGRAM_PREFIX[programId];
  if (!prefix) return "";
  const yy = String(year).slice(2);
  const re = new RegExp(`^${prefix}${yy}-(\\d+)$`);
  const nums = rows
    .map((r) => {
      const m = String(r.id || "").match(re);
      return m ? Number(m[1]) : 0;
    })
    .filter(Boolean);
  const next = (nums.length ? Math.max(...nums) : 0) + 1;
  return `${prefix}${yy}-${String(next).padStart(2, "0")}`;
}
const CONSENT_LABEL = { self: "본인", legal: "법정대리인", agent: "대리인" };

/* 심의월(YYYY-MM) → 사용기간 (다음달 1일부터 1년) */
function calcPeriod(reviewYM) {
  if (!reviewYM || !/^\d{4}-\d{2}$/.test(reviewYM)) return null;
  const [y, m] = reviewYM.split("-").map(Number);
  const start = new Date(y, m, 1);
  const end = new Date(y, m + 12, 0);
  const f = (d) =>
    `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  return { start: f(start), end: f(end), endDate: end };
}

function remainLabel(endDate) {
  if (!endDate) return null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const diff = Math.ceil((endDate - today) / 86400000);
  if (diff < 0) return { text: `${Math.abs(diff)}일 경과`, tone: "over" };
  if (diff <= 30) return { text: `D-${diff}`, tone: "warn" };
  return { text: `D-${diff}`, tone: "ok" };
}

const age = (birth) => {
  if (!birth) return "";
  const b = new Date(birth);
  const t = new Date();
  let a = t.getFullYear() - b.getFullYear();
  const m = t.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && t.getDate() < b.getDate())) a--;
  return a;
};

  const [progFilter, setProgFilter] = useState("all");

  const [reportMailSent, setReportMailSent] = useState({});

  const [draft, setDraft] = useState(null);

  const font = "'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif";
  const budgetSet = budgets !== null;
  const totalBudget = budgetSet
    ? PROGRAMS.reduce((s, p) => s + (Number(budgets[p.id]) || 0), 0)
    : 0;

  /* 당해년도 건, 사업별로 심의일 순 누적 계산 */
  const computed = useMemo(() => {
    if (!budgetSet) return [];
    const inYear = rows.filter((r) => {
      const d = r.reviewDate || r.reviewYM;
      return d ? String(d).slice(0, 4) === year : true;
    });
    const sorted = [...inYear].sort((a, b) => {
      if (!a.reviewDate) return 1;
      if (!b.reviewDate) return -1;
      return a.reviewDate.localeCompare(b.reviewDate);
    });
    const usedBy = {}; // 사업별 누적
    return sorted.map((r) => {
      const pid = r.program || "emergency";
      const pb = Number(budgets[pid]) || 0;
      const prev = usedBy[pid] || 0;
      const before = pb - prev;
      const grant = GRANTED.includes(r.status) ? Number(r.grantAmount) || 0 : 0;
      usedBy[pid] = prev + grant;
      return {
        ...r,
        program: pid,
        balanceBefore: before,
        cumulative: usedBy[pid],
        rate: pb ? (usedBy[pid] / pb) * 100 : 0,
      };
    });
  }, [rows, budgets, year, budgetSet]);

  /* 사업별 집행 현황 */
  const progStats = useMemo(() => {
    const out = {};
    PROGRAMS.forEach((p) => {
      const b = budgetSet ? Number(budgets[p.id]) || 0 : 0;
      const used = computed
        .filter((r) => r.program === p.id && GRANTED.includes(r.status))
        .reduce((s, r) => s + (Number(r.grantAmount) || 0), 0);
      out[p.id] = {
        budget: b,
        used,
        left: b - used,
        rate: b ? (used / b) * 100 : 0,
        count: computed.filter((r) => r.program === p.id).length,
      };
    });
    return out;
  }, [computed, budgets, budgetSet]);

  const totalUsed = PROGRAMS.reduce((s, p) => s + progStats[p.id].used, 0);
  const overallRate = totalBudget ? (totalUsed / totalBudget) * 100 : 0;

  const filtered = computed.filter((r) => {
    if (progFilter !== "all" && r.program !== progFilter) return false;
    if (filter !== "all" && r.status !== filter) return false;
    if (!q.trim()) return true;
    const t = q.trim().toLowerCase();
    return [r.ptName, r.id, r.hospital, r.diagnosis, r.swName].some((v) =>
      String(v).toLowerCase().includes(t)
    );
  });

  const counts = STATUS_ORDER.reduce((a, k) => {
    a[k] = computed.filter(
      (r) => (progFilter === "all" || r.program === progFilter) && r.status === k
    ).length;
    return a;
  }, {});
  const progScopeCount =
    progFilter === "all" ? computed.length : computed.filter((r) => r.program === progFilter).length;

  const setD = (k) => (e) => setDraft((s) => ({ ...s, [k]: e.target.value }));

    const key = draft._origId ?? draft.id;
    setRows((s) => s.map((r) => (r.id === key ? { ...draft, _origId: undefined } : r)));

    setSelected(allSelected ? selected.filter((id) => !filteredIds.includes(id)) : [...new Set([...selected, ...filteredIds])]);

    const picked = rows.filter((r) => selected.includes(r.id));
    if (!picked.length) return;
    const body = picked

        (r, i) =>
          (i > 0 ? '<div style="page-break-before:always"></div>' : "") +
          buildApplyDoc(r) +
          '<div style="page-break-before:always"></div>' +
          buildRecDoc(r)

      body

  };

          </p>

          <Field label="사업연도" required>
            <Input value={year} onChange={(e) => setYear(e.target.value)} style={{ maxWidth: 140 }} />

          <div style={{ display: "grid", gap: 12, marginTop: 18 }}>
            {PROGRAMS.map((p) => (

                  background: C.paper,

                  borderLeft: `3px solid ${p.color}`,

                }}

                <span style={{ fontSize: 13, fontWeight: 600, color: C.ink }}>
                  {p.label}

                </span>
                <div>
                  <Inline
                    value={budgetInput[p.id]}

                      setBudgetInput((s) => ({ ...s, [p.id]: e.target.value }))

                    w={160}
                    type="number"
                    invalid={
                      editingBudget &&
                      Number(budgetInput[p.id] || 0) < progStats[p.id].used

                  />
                  {editingBudget &&
                    Number(budgetInput[p.id] || 0) < progStats[p.id].used && (
                      <div style={{ fontSize: 11, color: C.seal, marginTop: 4, textAlign: "right" }}>
                        집행액보다 적습니다
                      </div>
                    )}
                </div>
              </div>
            ))}
          </div>

          <div

              display: "flex",
              justifyContent: "space-between",
              alignItems: "center",
              marginTop: 14,
              padding: "12px 14px",
              background: C.deepSoft,
              border: `1px solid ${C.deep}`,
              borderRadius: 3,
            }}
          >
            <span style={{ fontSize: 13, fontWeight: 700 }}>합계</span>
            <span style={{ fontSize: 16, fontWeight: 700, color: C.deep }}>
              {won(sum)} <span style={{ fontSize: 12, fontWeight: 400, color: C.muted }}>원</span>
            </span>
          </div>

          {(() => {
            const invalid =
              editingBudget &&
              PROGRAMS.some((p) => Number(budgetInput[p.id] || 0) < progStats[p.id].used);
            const ok = sum && !invalid;
            return (
              <div style={{ display: "flex", gap: 8, marginTop: 20 }}>
                {editingBudget && (
                  <button
                    type="button"
                    onClick={() => setEditingBudget(false)}
                    style={{
                      flex: "0 0 auto",
                      padding: "11px 22px",
                      fontSize: 14,
                      fontWeight: 600,
                      fontFamily: "inherit",
                      color: C.muted,
                      background: C.card,
                      border: `1px solid ${C.rule}`,
                      borderRadius: 3,
                      cursor: "pointer",
                    }}
                  >
                    취소
                  </button>
                )}
                <button
                  type="button"
                  onClick={() => {
                    setBudgets({ ...budgetInput });

                  disabled={!ok}
                  style={{
                    flex: 1,
                    padding: "11px 0",
                    fontSize: 14,
                    fontWeight: 700,
                    fontFamily: "inherit",
                    color: "#fff",
                    background: ok ? C.deep : "#A9B4B8",

                </button>

            );
          })()}
        </div>
      </main>
    );

  return (
    <div style={{ fontFamily: font, paddingBottom: 50 }}>
      <main style={{ maxWidth: 1400, margin: "0 auto", padding: "24px 20px 0" }}>

              {/* 본문 미리보기 */}
              <div>
                <div style={{ fontSize: 11, fontWeight: 700, color: C.deep, marginBottom: 6 }}>

                  {buildMailBody(mailFor)}

              </div>

              {mailSent[mailFor.id] && (
                <div style={{ fontSize: 11.5, color: C.ok }}>

                display: "flex", gap: 8, justifyContent: "flex-end",

              <button

                    {reportMailFor.swName} 담당자 · <strong>{reportMailFor.swEmail}</strong>
                  </div>
                </div>

                <div>
                  <div style={{ fontSize: 11, fontWeight: 700, color: C.deep, marginBottom: 6 }}>
                    제목
                  </div>
                  <div
                    style={{
                      padding: "10px 13px", background: C.card, border: `1px solid ${C.rule}`,
                      borderRadius: 3, fontSize: 13, fontWeight: 600,
                    }}
                  >
                    {buildReportMailSubject(reportMailFor)}
                  </div>
                </div>

                <div>
                  <div style={{ fontSize: 11, fontWeight: 700, color: C.deep, marginBottom: 6 }}>
                    본문
                  </div>
                  <div
                    style={{
                      padding: "14px 16px", background: C.card, border: `1px solid ${C.rule}`,
                      borderRadius: 3, fontSize: 12, color: C.ink, lineHeight: 1.75,
                      whiteSpace: "pre-line", maxHeight: 280, overflowY: "auto",
                    }}
                  >
                    {buildReportMailBody(reportMailFor, period)}
                  </div>
                </div>
              </div>

              <div
                style={{
                  display: "flex", gap: 8, justifyContent: "flex-end",
                  padding: "14px 22px", background: C.card, borderTop: `1px solid ${C.rule}`,
                }}
              >
                <button
                  type="button"
                  onClick={() => setReportMailFor(null)}
                  style={{
                    padding: "9px 20px", fontSize: 13.5, fontFamily: "inherit", fontWeight: 600,
                    color: C.muted, background: C.card, border: `1px solid ${C.rule}`,
                    borderRadius: 3, cursor: "pointer",
                  }}
                >
                  취소
                </button>
                <button
                  type="button"
                  onClick={() => {
                    const now = new Date();
                    const stamp = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")} ${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
                    setReportMailSent((s) => ({ ...s, [reportMailFor.id]: stamp }));
                    alert(
                      `${reportMailFor.swEmail} 앞으로 결과보고서 제출 안내 메일이 발송됩니다.\n\n` +
                        `제목: ${buildReportMailSubject(reportMailFor)}\n\n` +
                        `실제 운영 시 사용기간 종료 2개월 전 자동 발송됩니다.`
                    );
                    setReportMailFor(null);
                  }}
                  style={{
                    padding: "9px 24px", fontSize: 13.5, fontFamily: "inherit", fontWeight: 700,
                    color: "#fff", background: "#8A6D2F", border: "none", borderRadius: 3, cursor: "pointer",
                  }}
                >
                  안내 메일 발송
                </button>
              </div>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

  { id: "mh.jung", pw: "1234", swName: "정민호", hospital: "삼성서울병원", dept: "사회사업팀" },
];

  const [user, setUser] = useState(null);

              width: "100%",
              marginTop: 20,
              padding: "11px 0",
              fontSize: 14,
              fontWeight: 700,
              fontFamily: "inherit",
              color: "#fff",
              background: C.deep,
              border: "none",
              borderRadius: 3,
              cursor: "pointer",
            }}
          >
            로그인
          </button>

          <div
            style={{
              marginTop: 18,

const DEMO_MEMBERS = [
  { id: "member1", pw: "1234", name: "김도현", role: "심의위원" },
  { id: "member2", pw: "1234", name: "박서연", role: "심의위원" },
];

const manwon = (n) => `${(Number(n) / 10000).toLocaleString("ko-KR")}만원`;

function CommitteePage({ rows, setRows }) {
  const [member, setMember] = useState(null);
  const [form, setForm] = useState({ id: "", pw: "" });
  const [loginError, setLoginError] = useState("");
  const [openId, setOpenId] = useState(null);
  const [session, setSession] = useState("2026-07");
  const [docTab, setDocTab] = useState({});

  const font = "'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif";

  const login = () => {
    const found = DEMO_MEMBERS.find(
      (m) => m.id === form.id.trim() && m.pw === form.pw.trim()
    );
    if (found) {
      setMember(found);
      setLoginError("");
    } else {
      setLoginError("아이디 또는 비밀번호가 올바르지 않습니다.");
    }
  };

  /* 접수 상태 건만, 해당 회차 기준 */
  const targets = rows
    .filter((r) => {
      if (r.status !== "received") return false;
      if (!r.submittedAt) return true;
      return r.submittedAt.slice(0, 7) === session;
    })
    .sort(byProgram);

  const totalRequest = targets.reduce((s, r) => s + (Number(r.requestAmount) || 0), 0);
  const decided = targets.filter((r) => r.grantAmount).length;

  /* 심의위원 의견 저장 */
  const vote = (rowId, value) => {
    if (!member) return;
    setRows((s) =>
      s.map((r) => {
        if (r.id !== rowId) return r;
        const votes = { ...(r.votes || {}) };
        if (votes[member.id] === value) delete votes[member.id];
        else votes[member.id] = value;
        return { ...r, votes };
      })
    );
  };

  const voteCount = (r) => {
    const v = r.votes || {};
    const vals = Object.values(v);
    return {
      fit: vals.filter((x) => x === "fit").length,
      unfit: vals.filter((x) => x === "unfit").length,
      mine: member ? v[member.id] : null,
    };
  };

  /* --- 로그인 --- */
  if (!member) {
    return (
      <main style={{ maxWidth: 460, margin: "0 auto", padding: "50px 24px", fontFamily: font }}>
        <div
          style={{

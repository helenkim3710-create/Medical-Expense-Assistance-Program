function DocSlot({ doc, file, onPick, onClear, showError }) {

  return (
    <div
      style={{
        display: "flex",

        style={{

          lineHeight: "17px",
          textAlign: "center",
        }}
      >
        {file ? "✓" : ""}
      </div>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 13, fontWeight: 600, color: C.ink }}>

              fontSize: 10,
              fontWeight: 600,

            {doc.required ? "필수" : "선택"}
          </span>
        </div>
        {doc.note && (
          <div style={{ fontSize: 11, color: C.muted, marginTop: 2 }}>{doc.note}</div>
        )}
        {file && (
          <div style={{ fontSize: 11, color: C.ok, marginTop: 4, wordBreak: "break-all" }}>
            {file.name} · {(file.size / 1024).toFixed(0)}KB
          </div>
        )}
        {missing && (
          <div style={{ fontSize: 11, color: C.seal, marginTop: 4 }}>첨부가 필요합니다.</div>
        )}
      </div>
      <input
        ref={ref}
        type="file"
        style={{ display: "none" }}
        onChange={(e) => e.target.files?.[0] && onPick(e.target.files[0])}
      />
      <button
        type="button"
        onClick={() => (file ? onClear() : ref.current?.click())}
        style={{
          flexShrink: 0,
          padding: "5px 11px",

          cursor: "pointer",

          color: file ? C.muted : "#fff",
        }}
      >

      </button>
    </div>
  );
}

const REPORT_DOCS = [
  { id: "r0", name: "공문", required: true },
  { id: "r1", name: "지원금 집행 관련 영수증 일체", required: true },
];

const emptySettle = () => ({ date: "", amount: "", receiptNo: "", note: "" });

/* 병원명·담당자명·환자명으로 신청 건 조회 (공백·대소문자 무시) */
function findByLookup(rows, lookup) {
  const norm = (s) => String(s || "").replace(/\s+/g, "").toLowerCase();
  return (rows || []).find(
    (r) =>
      norm(r.hospital) === norm(lookup.hospital) &&
      norm(r.swName) === norm(lookup.swName) &&
      norm(r.ptName) === norm(lookup.ptName)
  );
}

            </div>
            <p style={{ fontSize: 14, fontWeight: 700, color: C.deep, margin: 0 }}>

        </Section>
      </main>

      <div
        style={{
          position: "fixed",

          right: 0,

          boxShadow: "0 -2px 12px rgba(0,0,0,0.06)",

        <div
          style={{
            maxWidth: 840,
            margin: "0 auto",
            display: "flex",
            alignItems: "center",
            gap: 14,

            style={{
              flex: 1,
              minWidth: 160,
              fontSize: 12,
              color: showError && !canSubmit ? C.seal : C.muted,

              <span style={{ color: C.ok, fontWeight: 600 }}>제출할 수 있습니다.</span>
            ) : (
              <>

          <button

            style={{
              padding: "10px 30px",
              fontSize: 14,
              fontWeight: 700,
              fontFamily: "inherit",

              background: canSubmit ? C.deep : "#A9B4B8",
              border: "none",
              borderRadius: 3,
              cursor: "pointer",
            }}

            결과보고서 제출
          </button>

    </div>
  );
}

/* ============================================================
   지원증서 전달식 진행상황 — 양식 원문 기준
   출처: _양식_치료비_지원증서전달_진행상황.pdf
   ============================================================ */
const CERT_DOCS = [
  {
    id: "p1",
    name: "증서전달 사진",
    note: "또는 환자의 치료비 지원 이후 근황을 알 수 있는 사진",
    required: true,
  },
];

function CertificateForm({ rows }) {
  const [step, setStep] = useState("lookup"); // lookup | form
  const [lookup, setLookup] = useState({ hospital: "", swName: "", ptName: "" });
  const [lookupError, setLookupError] = useState("");
  const [done, setDone] = useState(false);
  const [showError, setShowError] = useState(false);
  const [files, setFiles] = useState({});
  const [c, setC] = useState({
    ptName: "",
    grantYear: "",
    grantMonth: "",
    diagnosis: "",
    hospital: "",
    swName: "",
    swPhone: "",
    eventDate: "",
    eventTime: "",
    place: "",
    attendees: "",
    content: "",
  });

  const set = (k) => (e) => setC((s) => ({ ...s, [k]: e.target.value }));
  const setL = (k) => (e) => setLookup((s) => ({ ...s, [k]: e.target.value }));

  const required = [
    "swName", "swPhone", "eventDate", "place", "attendees", "content",
  ];
  const missing = required.filter((k) => !String(c[k] || "").trim());
  const missingDocs = CERT_DOCS.filter((d) => d.required && !files[d.id]);
  const canSubmit = missing.length === 0 && missingDocs.length === 0;

  const err = (k) => showError && !String(c[k] || "").trim();
  const eb = (k) => (err(k) ? { borderColor: C.seal } : {});

  const pick = (id) => (file) => setFiles((s) => ({ ...s, [id]: file }));
  const clear = (id) => () =>
    setFiles((s) => {
      const n = { ...s };
      delete n[id];
      return n;
    });

  const now = new Date();
  const font = "'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif";

  const submit = () => {
    setShowError(true);
    if (canSubmit) {
      setDone(true);
      window.scrollTo({ top: 0, behavior: "smooth" });
    } else {
      setTimeout(() => {
        document
          .querySelector("[data-invalid='true']")
          ?.scrollIntoView({ behavior: "smooth", block: "center" });
      }, 40);
    }
  };

  if (done) {
    return (
      <div
        style={{
          minHeight: "60vh",
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          padding: 24,
          fontFamily: font,
        }}
      >
        <div
          style={{
            maxWidth: 460,
            background: C.card,
            border: `1px solid ${C.rule}`,
            borderTop: `4px solid ${C.deep}`,
            borderRadius: 4,
            padding: "38px 34px",
            textAlign: "center",
          }}
        >
          <div style={{ fontSize: 30, marginBottom: 12 }}>✓</div>
          <h1 style={{ fontSize: 19, margin: "0 0 12px", color: C.ink }}>
            전달식 진행상황이 제출되었습니다
          </h1>
          <p style={{ fontSize: 13, color: C.muted, lineHeight: 1.7, margin: 0 }}>
            제출일 {now.getFullYear()}년 {now.getMonth() + 1}월 {now.getDate()}일
            <br />
            문의: 02-727-2485 · 3042@ohob.or.kr
          </p>
        </div>
      </div>
    );
  }

  /* --- 조회 --- */
  if (step === "lookup") {
    const ok = lookup.hospital.trim() && lookup.swName.trim() && lookup.ptName.trim();
    return (
      <main style={{ maxWidth: 520, margin: "0 auto", padding: "44px 24px", fontFamily: font }}>
        <div
          style={{
            background: C.card,
            border: `1px solid ${C.rule}`,
            borderRadius: 4,
            padding: "30px 28px",
          }}
        >
          <h2 style={{ fontSize: 18, fontWeight: 700, margin: "0 0 8px", color: C.ink }}>
            치료비 지원증서 전달
          </h2>
          <p style={{ fontSize: 13, color: C.muted, lineHeight: 1.7, margin: "0 0 22px" }}>
            지원이 확정된 신청 건의 병원명·담당자명·환자명을 입력해주세요. 환자 정보는 신청 내용에서 자동으로 불러옵니다.
          </p>
          <div style={{ display: "grid", gap: 14 }}>
            <Field label="병원명" required>
              <Input value={lookup.hospital} onChange={setL("hospital")} placeholder="예: 서울성모병원" />
            </Field>
            <Field label="담당자명" required hint="담당 사회복지사">
              <Input value={lookup.swName} onChange={setL("swName")} />
            </Field>
            <Field label="환자명" required>
              <Input value={lookup.ptName} onChange={setL("ptName")} />
            </Field>
          </div>
          {lookupError && (
            <div style={{ fontSize: 12, color: C.seal, marginTop: 12, lineHeight: 1.6 }}>
              {lookupError}
            </div>
          )}
          <button
            type="button"
            onClick={() => {
              if (!ok) return;
              const match = findByLookup(rows, lookup);
              if (!match) {
                setLookupError(
                  "일치하는 지원 확정 건을 찾을 수 없습니다. 병원명·담당자명·환자명을 다시 확인해주세요."
                );
                return;
              }
              setLookupError("");
              setLookup((s) => ({ ...s, matchedId: match.id }));
              const ym = match.reviewYM || "";
              setC((s) => ({
                ...s,
                ptName: match.ptName,
                diagnosis: match.diagnosis || "",
                hospital: match.hospital || "",
                swName: match.swName || "",
                swPhone: match.swPhone || "",
                grantYear: ym ? ym.slice(0, 4) : "",
                grantMonth: ym ? String(Number(ym.slice(5, 7))) : "",
              }));
              setStep("form");
            }}
            style={{
              width: "100%", marginTop: 20, padding: "11px 0", fontSize: 14, fontWeight: 700,
              fontFamily: "inherit", color: "#fff", background: C.deep, border: "none",
              borderRadius: 3, cursor: "pointer",
            }}
          >
            불러오기
          </button>
        </div>
      </main>
    );
  }

  return (

            padding: "13px 16px",

          <br />
          공문으로 제출하지 않으셔도 되며, 전달 후 이메일(3042@ohob.or.kr)로 보내주셔도 됩니다.
        </div>

        {/* 01 환자 정보 */}
        <Section label="01" title="환자 정보" sub="신청 내용에서 자동으로 불러온 정보입니다">

              border: `1px solid ${C.rule}`,
              borderRadius: 3,
            }}
          >
            {[
              ["접수번호", lookup.matchedId],
              ["환자명", c.ptName],
              ["지원받은 시기", c.grantYear && c.grantMonth ? `${c.grantYear}년 ${c.grantMonth}월` : "—"],
              ["진단명", c.diagnosis],
              ["진료병원", c.hospital],
              ["담당 사회복지사", c.swName],
              ["담당자 전화", c.swPhone],
            ].map(([k, v]) => (
              <div key={k}>
                <div style={{ fontSize: 10.5, color: C.muted, marginBottom: 3 }}>{k}</div>
                <div style={{ fontSize: 13, fontWeight: 600, color: C.ink }}>{v || "—"}</div>
              </div>

          </div>
        </Section>

        <Section label="02" title="전달식 진행">
          <div style={grid(200)}>

              <Input
                type="date"
                value={c.eventDate}
                onChange={set("eventDate")}
                data-invalid={err("eventDate")}
                style={eb("eventDate")}
              />
            </Field>
            <Field label="전달식 시간">
              <Input type="time" value={c.eventTime} onChange={set("eventTime")} />
            </Field>
            <Field label="장소" required>
              <Input value={c.place} onChange={set("place")} data-invalid={err("place")} style={eb("place")} />
            </Field>

              <Input value={c.attendees} onChange={set("attendees")} data-invalid={err("attendees")} style={eb("attendees")} />
            </Field>
            <Field
              label="내용"
              required
              wide
              hint="증서 전달식 진행내용 / 치료비 지원 후 환자 근황 / 환자의 감사인사 등"
            >
              <textarea

                onChange={set("content")}
                rows={8}
                data-invalid={err("content")}
                style={{ ...inputStyle, resize: "vertical", lineHeight: 1.7, ...eb("content") }}

            />

            </p>
            <p style={{ fontSize: 13, color: C.ink, margin: "0 0 18px" }}>
              {now.getFullYear()}년 {now.getMonth() + 1}월 {now.getDate()}일
              <span style={{ fontSize: 11, color: C.muted, marginLeft: 8 }}>

      <div

          bottom: 0,
          left: 0,
          right: 0,

          padding: "13px 24px",

        <div
          style={{
            maxWidth: 840,
            margin: "0 auto",
            display: "flex",
            alignItems: "center",
            gap: 14,
            flexWrap: "wrap",
          }}
        >
          <div
            style={{
              flex: 1,
              minWidth: 160,
              fontSize: 12,
              color: showError && !canSubmit ? C.seal : C.muted,
            }}
          >
            {canSubmit ? (
              <span style={{ color: C.ok, fontWeight: 600 }}>제출할 수 있습니다.</span>
            ) : (
              <>
                미입력 {missing.length}개 · 미첨부 {missingDocs.length}개
              </>
            )}
          </div>
          <button
            type="button"
            onClick={submit}
            style={{
              padding: "10px 30px",
              fontSize: 14,
              fontWeight: 700,
              fontFamily: "inherit",
              color: "#fff",
              background: canSubmit ? C.deep : "#A9B4B8",
              border: "none",
              borderRadius: 3,
              cursor: "pointer",
            }}
          >
            진행상황 제출
          </button>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   중간보고 및 연장계획서 — 양식 원문 기준
   출처: _양식_치료비_지원_중간보고_및_연장계획서.pdf
   ============================================================ */
const EXT_DOCS = [
  { id: "x0", name: "공문", required: true },
  { id: "x1", name: "영수증", required: true },
];

const emptyExtRow = () => ({ date: "", amount: "", receiptNo: "", note: "" });

function ExtensionForm({ allRows, setAllRows }) {
  const [step, setStep] = useState("lookup"); // lookup | form
  const [lookup, setLookup] = useState({ hospital: "", swName: "", ptName: "" });
  const [lookupError, setLookupError] = useState("");
  const [done, setDone] = useState(false);
  const [showError, setShowError] = useState(false);
  const [files, setFiles] = useState({});
  const [rows, setRows] = useState([emptyExtRow()]);
  const [useSettle, setUseSettle] = useState(false);
  const [x, setX] = useState({
    receiptNo: "",
    ptName: "", ptGender: "", ptBirth: "",
    hospital: "", diagnosis: "",
    applyPeriod: "",
    grantAmount: "", usedAmount: "",
    planFrom: "", planTo: "",
    extFrom: "", extTo: "",
    usageDetail: "",
    futurePlan: "",
    swName: "",
  });

  const set = (k) => (e) => setX((s) => ({ ...s, [k]: e.target.value }));
  const put = (k, v) => setX((s) => ({ ...s, [k]: v }));
  const setL = (k) => (e) => setLookup((s) => ({ ...s, [k]: e.target.value }));

  const A = Number(x.grantAmount) || 0;
  const B = Number(x.usedAmount) || 0;
  const balance = A - B;

  const addRow = () => setRows((s) => [...s, emptyExtRow()]);
  const delRow = (i) => setRows((s) => s.filter((_, n) => n !== i));
  const setRow = (i, k) => (e) =>
    setRows((s) => s.map((row, n) => (n === i ? { ...row, [k]: e.target.value } : row)));
  const rowTotal = rows.reduce((sum, row) => sum + (Number(row.amount) || 0), 0);

  const required = [
    "usedAmount", "planFrom", "planTo", "extFrom", "extTo",
    "usageDetail", "futurePlan", "swName",
  ];
  const missing = required.filter((k) => !String(x[k] || "").trim());
  const missingDocs = EXT_DOCS.filter((d) => d.required && !files[d.id]);
  const canSubmit = missing.length === 0 && missingDocs.length === 0;

  const err = (k) => showError && !String(x[k] || "").trim();
  const eb = (k) => (err(k) ? { borderColor: C.seal } : {});

  const pick = (id) => (file) => setFiles((s) => ({ ...s, [id]: file }));
  const clear = (id) => () =>
    setFiles((s) => {
      const n = { ...s };
      delete n[id];
      return n;
    });

  const now = new Date();
  const font = "'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif";

  const submit = () => {
    setShowError(true);
    if (canSubmit) {
      /* 관리자 페이지에 연장 요청 자동 반영 */
      if (setAllRows && x.receiptNo) {
        const today = new Date();
        const stamp = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;
        setAllRows((s) =>
          s.map((r) =>
            r.id === x.receiptNo.trim()
              ? {
                  ...r,
                  extension: {
                    requestedAt: stamp,
                    from: x.extFrom,
                    to: x.extTo,
                    reason: x.futurePlan,
                  },
                  note: r.note
                    ? `${r.note} / 연장요청 ${x.extTo}까지`
                    : `연장요청 ${x.extTo}까지`,
                }
              : r
          )
        );
      }
      setDone(true);
      window.scrollTo({ top: 0, behavior: "smooth" });
    } else {
      setTimeout(() => {
        document
          .querySelector("[data-invalid='true']")
          ?.scrollIntoView({ behavior: "smooth", block: "center" });
      }, 40);
    }
  };

  const cellInput = {
    width: "100%",
    boxSizing: "border-box",
    padding: "7px 8px",
    fontSize: 12.5,
    fontFamily: "inherit",
    border: "none",
    outline: "none",
    background: "transparent",
    color: C.ink,
  };

  if (done) {
    return (
      <div
        style={{
          minHeight: "60vh",
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          padding: 24,
          fontFamily: font,
        }}
      >
        <div
          style={{
            maxWidth: 460,
            background: C.card,
            border: `1px solid ${C.rule}`,
            borderTop: `4px solid ${C.deep}`,
            borderRadius: 4,
            padding: "38px 34px",
            textAlign: "center",
          }}
        >
          <div style={{ fontSize: 30, marginBottom: 12 }}>✓</div>
          <h1 style={{ fontSize: 19, margin: "0 0 12px", color: C.ink }}>
            중간보고 및 연장계획서가 제출되었습니다
          </h1>
          <p style={{ fontSize: 13, color: C.muted, lineHeight: 1.7, margin: 0 }}>
            제출일 {now.getFullYear()}년 {now.getMonth() + 1}월 {now.getDate()}일
            <br />
            문의: 02-727-2485 · 3042@ohob.or.kr
          </p>
        </div>
      </div>
    );
  }

  /* --- 조회 --- */
  if (step === "lookup") {
    const ok = lookup.hospital.trim() && lookup.swName.trim() && lookup.ptName.trim();
    return (

          <p style={{ fontSize: 13, color: C.muted, lineHeight: 1.7, margin: "0 0 22px" }}>
            지원이 확정된 신청 건의 병원명·담당자명·환자명을 입력해주세요. 환자 정보와 지원금액은 신청 내용에서 자동으로 불러옵니다.
          </p>
          <div style={{ display: "grid", gap: 14 }}>
            <Field label="병원명" required>
              <Input value={lookup.hospital} onChange={setL("hospital")} placeholder="예: 서울성모병원" />
            </Field>
            <Field label="담당자명" required hint="담당 사회복지사">
              <Input value={lookup.swName} onChange={setL("swName")} />
            </Field>
            <Field label="환자명" required>
              <Input value={lookup.ptName} onChange={setL("ptName")} />
            </Field>
          </div>
          {lookupError && (
            <div style={{ fontSize: 12, color: C.seal, marginTop: 12, lineHeight: 1.6 }}>
              {lookupError}
            </div>
          )}
          <button
            type="button"
            onClick={() => {
              if (!ok) return;
              const match = findByLookup(allRows, lookup);
              if (!match) {
                setLookupError(
                  "일치하는 지원 확정 건을 찾을 수 없습니다. 병원명·담당자명·환자명을 다시 확인해주세요."
                );
                return;
              }
              setLookupError("");
              setLookup((s) => ({ ...s, matchedId: match.id }));
              setX((s) => ({
                ...s,
                receiptNo: match.id,
                ptName: match.ptName || "",
                ptGender: match.gender || "",
                ptBirth: match.birth || "",
                hospital: match.hospital || "",
                diagnosis: match.diagnosis || "",
                applyPeriod: match.reviewYM ? match.reviewYM.replace("-", "년 ") + "월" : "",
                grantAmount: match.grantAmount || "",
                swName: match.swName || "",
              }));
              setStep("form");
            }}
            style={{
              width: "100%", marginTop: 20, padding: "11px 0", fontSize: 14, fontWeight: 700,
              fontFamily: "inherit", color: "#fff", background: C.deep, border: "none",
              borderRadius: 3, cursor: "pointer",
            }}
          >
            불러오기
          </button>
        </div>
      </main>
    );
  }

  return (
    <div style={{ fontFamily: font, paddingBottom: 90 }}>
      <main style={{ maxWidth: 840, margin: "0 auto", padding: "28px 24px 0" }}>
        <div
          style={{
            padding: "13px 16px",
            background: C.deepSoft,
            border: `1px solid ${C.rule}`,

            lineHeight: 1.7,
            color: C.ink,

        >
          <strong>치료비 지원 중간보고 및 연장계획서</strong>
          <br />
          지원금 사용기한 연장이 필요한 경우, 중간 결과와 향후 계획을 함께 제출합니다.
        </div>

        {/* 01 환자 정보 */}
        <Section label="01" title="환자 정보" sub="신청 내용에서 자동으로 불러온 정보입니다">
          <div
            style={{
              display: "grid",
              gridTemplateColumns: "repeat(auto-fit,minmax(150px,1fr))",
              gap: 12,
              padding: "16px 18px",
              background: C.fill,
              border: `1px solid ${C.rule}`,
              borderRadius: 3,
            }}
          >
            {[
              ["접수번호", x.receiptNo],
              ["환자명", x.ptName],
              ["성별", x.ptGender],
              ["생년월일", x.ptBirth],
              ["진료병원", x.hospital],
              ["진단명", x.diagnosis],
              ["지원 신청시기", x.applyPeriod],
            ].map(([k, v]) => (
              <div key={k}>
                <div style={{ fontSize: 10.5, color: C.muted, marginBottom: 3 }}>{k}</div>

              <span style={{ fontSize: 13, fontWeight: 600 }}>현재 사용액 (B)</span>
              <Inline

                onChange={set("usedAmount")}
                suffix="원"
                w={150}
                type="number"
                invalid={err("usedAmount")}
              />
            </div>
            <div
              style={{
                display: "flex",
                justifyContent: "space-between",
                alignItems: "center",
                padding: "13px 15px",
                background: C.deepSoft,
                border: `1px solid ${C.deep}`,
                borderRadius: 3,

                />

                <Input
                  type="date"
                  value={x.planTo}
                  onChange={set("planTo")}
                  data-invalid={err("planTo")}
                  style={{ width: 168, padding: "6px 9px", fontSize: 13.5, ...eb("planTo") }}
                />
              </div>
            </Field>
            <Field label="연장 요청기한" required>
              <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                <Input
                  type="date"
                  value={x.extFrom}
                  onChange={set("extFrom")}
                  data-invalid={err("extFrom")}
                  style={{ width: 168, padding: "6px 9px", fontSize: 13.5, ...eb("extFrom") }}
                />
                <span style={{ color: C.muted }}>~</span>
                <Input
                  type="date"
                  value={x.extTo}
                  onChange={set("extTo")}
                  data-invalid={err("extTo")}
                  style={{ width: 168, padding: "6px 9px", fontSize: 13.5, ...eb("extTo") }}
                />
              </div>
            </Field>

              label="현재까지의 지원금 사용내역 (치료 내용)"
              required
            >
              <textarea
                value={x.usageDetail}
                onChange={set("usageDetail")}
                rows={7}

            >
              <textarea

/* ---------- 문서 생성 · 다운로드 ---------- */
function downloadHTML(filename, title, bodyHTML) {
  const html = `<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>${title}</title>
<style>
  body{font-family:'Malgun Gothic','맑은 고딕',sans-serif;font-size:13px;color:#1B2A33;
       max-width:760px;margin:28px auto;padding:0 24px;line-height:1.7;}
  h1{font-size:19px;text-align:center;margin:0 0 4px;}
  .sub{text-align:center;color:#6E7A80;font-size:12px;margin-bottom:22px;}
  h2{font-size:13px;color:#2C5F6B;border-bottom:2px solid #2C5F6B;
     padding-bottom:5px;margin:22px 0 10px;}
  table{width:100%;border-collapse:collapse;margin-bottom:6px;font-size:12.5px;}
  th,td{border:1px solid #C6BFB1;padding:7px 9px;text-align:left;vertical-align:top;}
  th{background:#EDEAE3;font-weight:600;width:26%;}
  td.num{text-align:right;}
  .memo{border:1px solid #C6BFB1;padding:11px 13px;white-space:pre-line;min-height:44px;}
  .sign{text-align:center;margin-top:34px;line-height:2.1;}
  .sign strong{font-size:14px;color:#2C5F6B;}
  @media print{body{margin:0;}@page{margin:16mm;}}
</style></head><body>${bodyHTML}</body></html>`;
  const blob = new Blob(["\ufeff", html], { type: "text/html;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* 결과보고서 제출 안내 대상 여부: 사용기간 종료 60일 이내 & 미제출 */
function reportDueInfo(r) {
  if (!GRANTED.includes(r.status)) return null;
  if (r.reportDate) return null;
  const p = calcPeriod(r.reviewYM);
  if (!p) return null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const daysLeft = Math.ceil((p.endDate - today) / 86400000);
  if (daysLeft > 60) return null; // 아직 2달 이상 남음
  return { period: p, daysLeft };
}

function certSeqFromId(id) {
  const m = String(id || "").match(/-(\d+)$/);
  return m ? m[1] : "";
}

function reviewYMToDateText(ym) {
  if (!ym || !/^\d{4}-\d{2}$/.test(ym)) return "＿＿＿＿. ＿＿. ＿＿.";
  const [y, m] = ym.split("-");
  return `${y}. ${m}. ＿＿.`; // 발급일은 전달 시점에 기입
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

async function ensureDocx() {
  if (typeof window !== "undefined" && window.docx) return true;
  // 혹시 로드가 안 됐으면 대체 CDN에서 재시도
  const sources = [
    "https://cdn.jsdelivr.net/npm/docx@8.5/build/index.umd.min.js",
    "https://unpkg.com/docx@8.5.0/build/index.umd.js",
  ];
  for (const src of sources) {
    try {
      await loadScript(src);
      if (window.docx) return true;
    } catch (e) {
      /* 다음 소스 시도 */
    }
  }
  return !!(window && window.docx);
}

async function downloadCertificate(r) {

  const {

    Table, TableRow, TableCell, WidthType, TableLayoutType, ImageRun,
  } = window.docx;

  const b64ToBytes = (b64) => {
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;

  const symbol = b64ToBytes(CERT_IMG_SYMBOL);

  const cell = new TableCell({

      new Paragraph({

        alignment: AlignmentType.CENTER,
        spacing: { after: 560 },
        children: [new TextRun({ text: dateText, size: 24, font: "바탕" })],
      }),
      new Paragraph({
        alignment: AlignmentType.CENTER,
        spacing: { after: 40 },
        children: [new ImageRun({ type: CERT_IMG_LOGO_TYPE, data: logo, transformation: { width: 150, height: 60 } })],
      }),
      new Paragraph({
        alignment: AlignmentType.CENTER,
        spacing: { after: 100 },
        children: [
          new TextRun({ text: "본부장  오 승 원 신부   ", bold: true, size: 28, font: "바탕" }),
          new ImageRun({ type: CERT_IMG_SEAL_TYPE, data: seal, transformation: { width: 60, height: 60 } }),
        ],

  const table = new Table({
    width: { size: 9200, type: WidthType.DXA },
    columnWidths: [9200],
    layout: TableLayoutType.FIXED,

    sections: [

    setTimeout(() => URL.revokeObjectURL(url), 1000);

const PROGRAM_ORDER = PROGRAMS.reduce((a, p, i) => ({ ...a, [p.id]: i }), {});
const byProgram = (a, b) => {
  const pa = PROGRAM_ORDER[a.program] ?? 99;
  const pb = PROGRAM_ORDER[b.program] ?? 99;
  if (pa !== pb) return pa - pb;
  return String(a.id).localeCompare(String(b.id));
};

/* 접수번호 자동생성 — 구분+년도(2자리)-순번(2자리) 예: 백난26-01 */
function makeReceiptNo(programId, year, rows) {
  const prefix = PROGRAM_PREFIX[programId];
  if (!prefix) return "";
  const yy = String(year).slice(2);
  const re = new RegExp(`^${prefix}${yy}-(\\d+)$`);
  const nums = rows
    .map((r) => {
      const m = String(r.id || "").match(re);
      return m ? Number(m[1]) : 0;
    })
    .filter(Boolean);
  const next = (nums.length ? Math.max(...nums) : 0) + 1;
  return `${prefix}${yy}-${String(next).padStart(2, "0")}`;
}

/* 심의월(YYYY-MM) → 사용기간 (다음달 1일부터 1년) */
function calcPeriod(reviewYM) {
  if (!reviewYM || !/^\d{4}-\d{2}$/.test(reviewYM)) return null;
  const [y, m] = reviewYM.split("-").map(Number);
  const start = new Date(y, m, 1);
  const end = new Date(y, m + 12, 0);
  const f = (d) =>
    `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  return { start: f(start), end: f(end), endDate: end };
}

function remainLabel(endDate) {
  if (!endDate) return null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const diff = Math.ceil((endDate - today) / 86400000);
  if (diff < 0) return { text: `${Math.abs(diff)}일 경과`, tone: "over" };
  if (diff <= 30) return { text: `D-${diff}`, tone: "warn" };
  return { text: `D-${diff}`, tone: "ok" };
}

const age = (birth) => {
  if (!birth) return "";
  const b = new Date(birth);
  const t = new Date();
  let a = t.getFullYear() - b.getFullYear();
  const m = t.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && t.getDate() < b.getDate())) a--;
  return a;
};

function AdminPage() {
  const [rows, setRows] = useState(SAMPLE);
  const [budgets, setBudgets] = useState(null); // {leukemia, transplant, emergency}
  const [budgetInput, setBudgetInput] = useState({ ...DEFAULT_BUDGET });
  const [year, setYear] = useState("2026");
  const [q, setQ] = useState("");
  const [filter, setFilter] = useState("all");
  const [progFilter, setProgFilter] = useState("all");
  const [selected, setSelected] = useState([]);
  const [docsOpen, setDocsOpen] = useState(false);
  const [editOpen, setEditOpen] = useState(false);
  const [mailFor, setMailFor] = useState(null); // 메일 발송 대상 건
  const [mailFile, setMailFile] = useState(null); // 첨부 공문 PDF
  const [mailSent, setMailSent] = useState({}); // { [rowId]: 발송일시 }
  const [reportMailFor, setReportMailFor] = useState(null); // 결과보고서 요청 메일 대상
  const [reportMailSent, setReportMailSent] = useState({});
  const [editingBudget, setEditingBudget] = useState(false);
  const [draft, setDraft] = useState(null);

  const font = "'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif";
  const budgetSet = budgets !== null;
  const totalBudget = budgetSet
    ? PROGRAMS.reduce((s, p) => s + (Number(budgets[p.id]) || 0), 0)
    : 0;

  /* 당해년도 건, 사업별로 심의일 순 누적 계산 */
  const computed = useMemo(() => {
    if (!budgetSet) return [];
    const inYear = rows.filter((r) => {
      const d = r.reviewDate || r.reviewYM;
      return d ? String(d).slice(0, 4) === year : true;
    });
    const sorted = [...inYear].sort((a, b) => {
      if (!a.reviewDate) return 1;
      if (!b.reviewDate) return -1;
      return a.reviewDate.localeCompare(b.reviewDate);
    });
    const usedBy = {}; // 사업별 누적
    return sorted.map((r) => {
      const pid = r.program || "emergency";
      const pb = Number(budgets[pid]) || 0;
      const prev = usedBy[pid] || 0;
      const before = pb - prev;
      const grant = GRANTED.includes(r.status) ? Number(r.grantAmount) || 0 : 0;
      usedBy[pid] = prev + grant;
      return {
        ...r,
        program: pid,
        balanceBefore: before,
        cumulative: usedBy[pid],
        rate: pb ? (usedBy[pid] / pb) * 100 : 0,
      };
    });
  }, [rows, budgets, year, budgetSet]);

  /* 사업별 집행 현황 */
  const progStats = useMemo(() => {
    const out = {};
    PROGRAMS.forEach((p) => {
      const b = budgetSet ? Number(budgets[p.id]) || 0 : 0;
      const used = computed
        .filter((r) => r.program === p.id && GRANTED.includes(r.status))
        .reduce((s, r) => s + (Number(r.grantAmount) || 0), 0);
      out[p.id] = {
        budget: b,
        used,
        left: b - used,
        rate: b ? (used / b) * 100 : 0,
        count: computed.filter((r) => r.program === p.id).length,
      };
    });
    return out;
  }, [computed, budgets, budgetSet]);

  const totalUsed = PROGRAMS.reduce((s, p) => s + progStats[p.id].used, 0);
  const overallRate = totalBudget ? (totalUsed / totalBudget) * 100 : 0;

  const filtered = computed.filter((r) => {
    if (progFilter !== "all" && r.program !== progFilter) return false;
    if (filter !== "all" && r.status !== filter) return false;
    if (!q.trim()) return true;
    const t = q.trim().toLowerCase();
    return [r.ptName, r.id, r.hospital, r.diagnosis, r.swName].some((v) =>
      String(v).toLowerCase().includes(t)
    );
  });

  const counts = STATUS_ORDER.reduce((a, k) => {
    a[k] = computed.filter(
      (r) => (progFilter === "all" || r.program === progFilter) && r.status === k
    ).length;
    return a;
  }, {});
  const progScopeCount =
    progFilter === "all" ? computed.length : computed.filter((r) => r.program === progFilter).length;

  const setD = (k) => (e) => setDraft((s) => ({ ...s, [k]: e.target.value }));
  const saveEdit = () => {
    const key = draft._origId ?? draft.id;
    const prev = rows.find((r) => r.id === key);
    /* 승인 상태로 새로 전환되고 결정금액이 있으면 지원증서 자동 제작 */
    const newlyApproved =
      GRANTED.includes(draft.status) &&
      !(prev && GRANTED.includes(prev.status)) &&
      draft.grantAmount &&
      draft.program;
    setRows((s) => s.map((r) => (r.id === key ? { ...draft, _origId: undefined } : r)));
    setDraft(null);
    if (newlyApproved) {
      setTimeout(() => {
        if (window.confirm(`${draft.ptName} 님의 지원이 승인되었습니다.\n지원증서를 지금 다운로드하시겠습니까?`)) {
          downloadCertificate(draft);
        }
      }, 100);
    }
  };
  const period = draft ? calcPeriod(draft.reviewYM) : null;

  /* 선택 · 일괄 다운로드 */
  const toggleSel = (id) =>
    setSelected((s) => (s.includes(id) ? s.filter((x) => x !== id) : [...s, id]));
  const filteredIds = filtered.map((r) => r.id);
  const allSelected = filteredIds.length > 0 && filteredIds.every((id) => selected.includes(id));
  const toggleAll = () =>
    setSelected(allSelected ? selected.filter((id) => !filteredIds.includes(id)) : [...new Set([...selected, ...filteredIds])]);
  const bulkDownload = () => {
    const picked = rows.filter((r) => selected.includes(r.id));
    if (!picked.length) return;
    const body = picked
      .map(
        (r, i) =>
          (i > 0 ? '<div style="page-break-before:always"></div>' : "") +
          buildApplyDoc(r) +
          '<div style="page-break-before:always"></div>' +
          buildRecDoc(r)
      )
      .join("");
    downloadHTML(
      `치료비지원_일괄_${picked.length}건_${year}.html`,
      `치료비 지원 서류 일괄 (${picked.length}건)`,
      body
    );
    const withDocs = picked.filter((r) => (r.docs || []).some((d) => d.ok));
    if (withDocs.length) {
      alert(
        `${picked.length}건의 신청서·추천서를 내려받았습니다.\n\n` +
          `첨부서류가 있는 ${withDocs.length}건은 실제 운영 시 함께 ZIP으로 묶여 다운로드됩니다.`
      );
    }
  };

  /* --- 예산 최초 입력 --- */
  if (!budgetSet || editingBudget) {
    const sum = PROGRAMS.reduce((s, p) => s + (Number(budgetInput[p.id]) || 0), 0);
    return (
      <main style={{ maxWidth: 560, margin: "0 auto", padding: "50px 24px", fontFamily: font }}>
        <div
          style={{
            background: C.card,
            border: `1px solid ${C.rule}`,
            borderTop: `4px solid ${C.deep}`,
            borderRadius: 4,
            padding: "30px 28px",
          }}
        >
          <h2 style={{ fontSize: 18, fontWeight: 700, margin: "0 0 8px", color: C.ink }}>
            {editingBudget ? "예산 수정" : "치료비 지원사업 예산 설정"}
          </h2>
          <p style={{ fontSize: 13, color: C.muted, lineHeight: 1.7, margin: "0 0 22px" }}>
            {editingBudget
              ? "사업별 예산을 수정합니다. 이미 집행된 금액보다 적게 설정할 수 없습니다."
              : "사업별 당해년도 예산을 입력해주세요. 이후 승인된 지원 결정금액이 해당 사업 예산에서 자동으로 차감되며, 사업별 집행률이 계산됩니다."}
          </p>

          <Field label="사업연도" required>
            <Input value={year} onChange={(e) => setYear(e.target.value)} style={{ maxWidth: 140 }} />
          </Field>

          <div style={{ display: "grid", gap: 12, marginTop: 18 }}>
            {PROGRAMS.map((p) => (
              <div
                key={p.id}
                style={{
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "space-between",
                  gap: 10,
                  flexWrap: "wrap",
                  padding: "12px 14px",
                  background: C.paper,
                  border: `1px solid ${C.rule}`,
                  borderLeft: `3px solid ${p.color}`,
                  borderRadius: 3,
                }}
              >
                <span style={{ fontSize: 13, fontWeight: 600, color: C.ink }}>
                  {p.label}
                  {editingBudget && progStats[p.id].used > 0 && (
                    <span style={{ display: "block", fontSize: 11, color: C.muted, fontWeight: 400 }}>
                      집행 {won(progStats[p.id].used)}원
                    </span>
                  )}
                </span>
                <div>
                  <Inline
                    value={budgetInput[p.id]}
                    onChange={(e) =>
                      setBudgetInput((s) => ({ ...s, [p.id]: e.target.value }))
                    }
                    suffix="원"
                    w={160}
                    type="number"
                    invalid={
                      editingBudget &&
                      Number(budgetInput[p.id] || 0) < progStats[p.id].used
                    }
                  />
                  {editingBudget &&
                    Number(budgetInput[p.id] || 0) < progStats[p.id].used && (
                      <div style={{ fontSize: 11, color: C.seal, marginTop: 4, textAlign: "right" }}>
                        집행액보다 적습니다
                      </div>
                    )}
                </div>
              </div>
            ))}
          </div>

          <div
            style={{
              display: "flex",
              justifyContent: "space-between",
              alignItems: "center",
              marginTop: 14,
              padding: "12px 14px",
              background: C.deepSoft,
              border: `1px solid ${C.deep}`,
              borderRadius: 3,
            }}
          >
            <span style={{ fontSize: 13, fontWeight: 700 }}>합계</span>
            <span style={{ fontSize: 16, fontWeight: 700, color: C.deep }}>
              {won(sum)} <span style={{ fontSize: 12, fontWeight: 400, color: C.muted }}>원</span>
            </span>
          </div>

          {(() => {
            const invalid =
              editingBudget &&
              PROGRAMS.some((p) => Number(budgetInput[p.id] || 0) < progStats[p.id].used);
            const ok = sum && !invalid;
            return (
              <div style={{ display: "flex", gap: 8, marginTop: 20 }}>
                {editingBudget && (
                  <button
                    type="button"
                    onClick={() => setEditingBudget(false)}
                    style={{
                      flex: "0 0 auto",
                      padding: "11px 22px",
                      fontSize: 14,
                      fontWeight: 600,
                      fontFamily: "inherit",
                      color: C.muted,
                      background: C.card,
                      border: `1px solid ${C.rule}`,
                      borderRadius: 3,
                      cursor: "pointer",
                    }}
                  >
                    취소
                  </button>
                )}
                <button
                  type="button"
                  onClick={() => {
                    setBudgets({ ...budgetInput });
                    setEditingBudget(false);
                  }}
                  disabled={!ok}
                  style={{
                    flex: 1,
                    padding: "11px 0",
                    fontSize: 14,
                    fontWeight: 700,
                    fontFamily: "inherit",
                    color: "#fff",
                    background: ok ? C.deep : "#A9B4B8",
                    border: "none",
                    borderRadius: 3,
                    cursor: ok ? "pointer" : "default",
                  }}
                >
                  {editingBudget ? "예산 수정" : "예산 확정"}
                </button>
              </div>
            );
          })()}
        </div>
      </main>
    );
  }

  return (
    <div style={{ fontFamily: font, paddingBottom: 50 }}>
      <main style={{ maxWidth: 1400, margin: "0 auto", padding: "24px 20px 0" }}>
        {/* 결과보고서 제출 안내 대상 */}
        {(() => {
          const due = rows
            .map((r) => ({ r, info: reportDueInfo(r) }))
            .filter((x) => x.info)
            .sort((a, b) => a.info.daysLeft - b.info.daysLeft);
          if (due.length === 0) return null;
          const unsent = due.filter((x) => !reportMailSent[x.r.id]);
          return (
            <div
              style={{
                padding: "14px 16px",
                background: "#FBF3E0",
                border: `1px solid #D8C08A`,
                borderRadius: 3,
                marginBottom: 14,
              }}
            >
              <div
                style={{
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "space-between",
                  gap: 10,
                  flexWrap: "wrap",
                  marginBottom: due.length ? 10 : 0,
                }}
              >
                <span style={{ fontSize: 13, fontWeight: 700, color: "#8A6D2F" }}>
                  결과보고서 제출 안내 대상 {due.length}건 · 미발송 {unsent.length}건
                </span>
                <span style={{ fontSize: 11.5, color: "#8A6D2F" }}>
                  사용기간 종료 2개월 전 자동 안내 대상입니다.
                </span>
              </div>
              <div style={{ display: "grid", gap: 6 }}>
                {due.map(({ r, info }) => {
                  const sent = reportMailSent[r.id];
                  return (
                    <div
                      key={r.id}
                      style={{
                        display: "flex",
                        alignItems: "center",
                        gap: 10,
                        flexWrap: "wrap",
                        padding: "9px 12px",
                        background: C.card,
                        border: `1px solid ${C.rule}`,
                        borderRadius: 3,
                      }}
                    >
                      <span style={{ fontSize: 12, fontWeight: 600, color: C.ink, minWidth: 90 }}>
                        {r.id}
                      </span>
                      <span style={{ fontSize: 12.5, fontWeight: 600 }}>{r.ptName}</span>
                      <span style={{ fontSize: 11.5, color: C.muted }}>{r.hospital}</span>
                      <span
                        style={{
                          fontSize: 11,
                          fontWeight: 700,
                          padding: "1px 7px",
                          borderRadius: 2,
                          background: info.daysLeft <= 30 ? C.sealSoft : "#FBF3E0",
                          color: info.daysLeft <= 30 ? C.seal : "#8A6D2F",
                        }}
                      >
                        종료 D-{info.daysLeft}
                      </span>
                      <span style={{ fontSize: 11.5, color: C.muted }}>
                        ~ {info.period.end}
                      </span>
                      {sent ? (
                        <span style={{ fontSize: 11, color: C.ok, fontWeight: 600, marginLeft: "auto" }}>
                          ✓ {sent} 발송
                        </span>
                      ) : (
                        <button
                          type="button"
                          onClick={() => setReportMailFor(r)}
                          style={{
                            marginLeft: "auto",
                            padding: "5px 12px",
                            fontSize: 11.5,
                            fontFamily: "inherit",
                            fontWeight: 700,
                            color: "#fff",
                            background: "#8A6D2F",
                            border: "none",
                            borderRadius: 3,
                            cursor: "pointer",
                          }}
                        >
                          안내 메일 발송
                        </button>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })()}

        {/* 연도 · 예산 설정 */}
        <div
          style={{
            display: "flex",
            alignItems: "center",
            justifyContent: "space-between",
            gap: 12,
            flexWrap: "wrap",
            marginBottom: 12,
          }}
        >
          <div style={{ fontSize: 15, fontWeight: 700, color: C.ink }}>
            {year}년 치료비 지원사업 현황
          </div>
          <button
            type="button"
            onClick={() => {
              setBudgetInput({ ...budgets });
              setEditingBudget(true);
            }}
            style={{
              padding: "7px 14px",
              fontSize: 12,
              fontFamily: "inherit",
              fontWeight: 600,
              color: C.deep,
              background: C.card,
              border: `1px solid ${C.deep}`,
              borderRadius: 3,
              cursor: "pointer",
            }}
          >
            예산 설정
          </button>
        </div>

        {/* 사업별 예산 현황 */}
        <div
          style={{
            display: "grid",
            gridTemplateColumns: "repeat(auto-fit,minmax(230px,1fr))",
            gap: 10,
            marginBottom: 12,
          }}
        >
          {PROGRAMS.map((p) => {
            const s = progStats[p.id];
            const on = progFilter === p.id;
            return (
              <button
                key={p.id}
                type="button"
                onClick={() => { setProgFilter(on ? "all" : p.id); setFilter("all"); }}
                style={{
                  textAlign: "left",
                  fontFamily: "inherit",
                  cursor: "pointer",
                  padding: "13px 15px",
                  background: C.card,
                  border: `1px solid ${on ? p.color : C.rule}`,
                  borderLeft: `4px solid ${p.color}`,
                  borderRadius: 3,
                  boxShadow: on ? `0 0 0 1px ${p.color}` : "none",
                }}
              >
                <div
                  style={{
                    display: "flex",
                    justifyContent: "space-between",
                    alignItems: "baseline",
                    marginBottom: 7,
                  }}
                >
                  <span style={{ fontSize: 12, fontWeight: 700, color: p.color }}>{p.short}</span>
                  <span style={{ fontSize: 10.5, color: C.muted }}>{s.count}건</span>
                </div>
                <div style={{ fontSize: 17, fontWeight: 700, color: C.ink }}>
                  {won(s.left)}
                  <span style={{ fontSize: 11, fontWeight: 400, color: C.muted }}> 원 남음</span>
                </div>
                <div style={{ fontSize: 10.5, color: C.muted, marginTop: 3 }}>
                  예산 {won(s.budget)} · 집행 {won(s.used)}
                </div>
                <div
                  style={{
                    height: 4,
                    background: "#E8E4DA",
                    borderRadius: 2,
                    marginTop: 7,
                    overflow: "hidden",
                  }}
                >
                  <div
                    style={{
                      height: "100%",
                      width: `${Math.min(s.rate, 100)}%`,
                      background: s.rate > 90 ? C.seal : p.color,
                    }}
                  />
                </div>
                <div
                  style={{
                    fontSize: 11,
                    fontWeight: 700,
                    color: s.rate > 90 ? C.seal : C.muted,
                    marginTop: 4,
                  }}
                >
                  집행률 {s.rate.toFixed(1)}%
                </div>
              </button>
            );
          })}

          {/* 전체 합계 */}
          <button
            type="button"
            onClick={() => { setProgFilter("all"); setFilter("all"); }}
            style={{
              textAlign: "left",
              fontFamily: "inherit",
              cursor: "pointer",
              padding: "13px 15px",
              background: C.deep,
              border: `1px solid ${C.deep}`,
              borderRadius: 3,
              color: "#fff",
              boxShadow: progFilter === "all" ? `0 0 0 2px ${C.ink}` : "none",
            }}
          >
            <div
              style={{
                display: "flex",
                justifyContent: "space-between",
                alignItems: "baseline",
                marginBottom: 7,
              }}
            >
              <span style={{ fontSize: 12, fontWeight: 700, opacity: 0.9 }}>{year}년 전체</span>
              <span style={{ fontSize: 10.5, opacity: 0.8 }}>{computed.length}건</span>
            </div>
            <div style={{ fontSize: 17, fontWeight: 700 }}>
              {won(totalBudget - totalUsed)}
              <span style={{ fontSize: 11, fontWeight: 400, opacity: 0.8 }}> 원 남음</span>
            </div>
            <div style={{ fontSize: 10.5, opacity: 0.8, marginTop: 3 }}>
              예산 {won(totalBudget)} · 집행 {won(totalUsed)}
            </div>
            <div
              style={{
                height: 4,
                background: "rgba(255,255,255,0.25)",
                borderRadius: 2,
                marginTop: 7,
                overflow: "hidden",
              }}
            >
              <div
                style={{
                  height: "100%",
                  width: `${Math.min(overallRate, 100)}%`,
                  background: "#fff",
                }}
              />
            </div>
            <div style={{ fontSize: 11, fontWeight: 700, marginTop: 4, opacity: 0.9 }}>
              집행률 {overallRate.toFixed(1)}%
            </div>
          </button>
        </div>

        {progFilter !== "all" && (
          <div style={{ fontSize: 12, color: C.muted, marginBottom: 10 }}>
            {PROGRAM_LABEL[progFilter]} 사업만 표시 중 ·{" "}
            <button
              type="button"
              onClick={() => setProgFilter("all")}
              style={{
                border: "none",
                background: "transparent",
                color: C.deep,
                fontFamily: "inherit",
                fontSize: 12,
                fontWeight: 600,
                cursor: "pointer",
                padding: 0,
                textDecoration: "underline",
              }}
            >
              전체 보기
            </button>
          </div>
        )}

        {/* 검색 · 필터 */}
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", marginBottom: 12 }}>
          <Input
            value={q}
            onChange={(e) => setQ(e.target.value)}
            placeholder="환자명 · 접수번호 · 병원 · 진단명 · 담당자"
            style={{ maxWidth: 260 }}
          />
          <button
            type="button"
            onClick={() => setFilter("all")}
            style={{
              padding: "6px 12px", fontSize: 12, fontFamily: "inherit", fontWeight: 600,
              borderRadius: 3, cursor: "pointer",
              border: `1px solid ${filter === "all" ? C.deep : C.rule}`,
              background: filter === "all" ? C.deep : C.card,
              color: filter === "all" ? "#fff" : C.muted,
            }}
          >
            전체 {progScopeCount}
          </button>
          {STATUS_ORDER.map((k) => (
            <button
              key={k}
              type="button"
              onClick={() => setFilter(k)}
              style={{
                padding: "6px 12px", fontSize: 12, fontFamily: "inherit", fontWeight: 600,
                borderRadius: 3, cursor: "pointer",
                border: `1px solid ${filter === k ? C.deep : C.rule}`,
                background: filter === k ? C.deep : C.card,
                color: filter === k ? "#fff" : C.muted,
              }}
            >
              {STATUS[k].label} {counts[k]}
            </button>
          ))}
        </div>

        {/* 일괄 다운로드 바 */}
        {selected.length > 0 && (
          <div
            style={{
              display: "flex",
              alignItems: "center",
              justifyContent: "space-between",
              gap: 12,
              flexWrap: "wrap",
              padding: "11px 15px",
              background: C.deepSoft,
              border: `1px solid ${C.deep}`,
              borderRadius: 3,
              marginBottom: 12,
            }}
          >
            <span style={{ fontSize: 13, fontWeight: 600, color: C.ink }}>
              {selected.length}건 선택됨
            </span>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              <button
                type="button"
                onClick={() => setSelected([])}
                style={{
                  padding: "7px 14px",
                  fontSize: 12,
                  fontFamily: "inherit",
                  fontWeight: 600,
                  color: C.muted,
                  background: C.card,
                  border: `1px solid ${C.rule}`,
                  borderRadius: 3,
                  cursor: "pointer",
                }}
              >
                선택 해제
              </button>
              <button
                type="button"
                onClick={bulkDownload}
                style={{
                  padding: "7px 16px",
                  fontSize: 12,
                  fontFamily: "inherit",
                  fontWeight: 700,
                  color: "#fff",
                  background: C.deep,
                  border: "none",
                  borderRadius: 3,
                  cursor: "pointer",
                }}
              >
                ↓ 선택 {selected.length}건 서류 일괄 다운로드
              </button>
            </div>
          </div>
        )}

        {/* 목록 표 */}
        <div style={{ overflowX: "auto", marginBottom: 24 }}>
          <table style={{ borderCollapse: "collapse", fontSize: 12, minWidth: 1900 }}>
            <thead>
              <tr>
                <th style={{ ...stickyCell(0, th, "#EDEAE3"), width: 34, zIndex: 6 }}>
                  <input
                    type="checkbox"
                    checked={allSelected}
                    onChange={toggleAll}
                    style={{ accentColor: C.deep, cursor: "pointer" }}
                  />
                </th>
                <th style={{ ...stickyCell(1, th, "#EDEAE3"), width: 50, zIndex: 6 }}>심의</th>
                {[
                  "사업", "날짜", "접수번호", "환자명", "성별", "생년월일", "나이", "진단명", "병원",
                  "신청금액", "결정금액", "예산 잔액", "집행률(%)", "후원자", "동의자",
                  "초상 공개 여부", "결과보고서", "비고", "담당자", "담당자 연락처", "담당자 메일",
                ].map((h, i) => (
                  <th key={i} style={th}>
                    {h}
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filtered.map((r) => {
                const st = STATUS[r.status];
                const p = calcPeriod(r.reviewYM);
                const rem = p && GRANTED.includes(r.status) ? remainLabel(p.endDate) : null;
                return (
                  <tr key={r.id} style={selected.includes(r.id) ? { background: C.deepSoft } : undefined}>
                    <td style={{ ...stickyCell(0, td, selected.includes(r.id) ? C.deepSoft : "#fff"), textAlign: "center", padding: "5px 7px", width: 34 }}>
                      <input
                        type="checkbox"
                        checked={selected.includes(r.id)}
                        onChange={() => toggleSel(r.id)}
                        style={{ accentColor: C.deep, cursor: "pointer" }}
                      />
                    </td>
                    <td style={{ ...stickyCell(1, td, selected.includes(r.id) ? C.deepSoft : "#fff"), textAlign: "center", padding: "5px 7px", width: 50 }}>
                      <button
                        type="button"
                        onClick={() => { setDraft({ ...r, _origId: r.id }); setDocsOpen(false); setEditOpen(false); }}
                        style={{
                          padding: "4px 10px", fontSize: 11, fontFamily: "inherit", fontWeight: 600,
                          color: "#fff", background: C.deep, border: "none", borderRadius: 3,
                          cursor: "pointer",
                        }}
                      >
                        심의
                      </button>
                    </td>
                    <td style={{ ...td, textAlign: "center" }}>
                      {(() => {
                        const pg = PROGRAMS.find((x) => x.id === r.program);
                        return pg ? (

                  style={{
                    padding: "9px 20px", fontSize: 13.5, fontFamily: "inherit", fontWeight: 600,
                    color: C.muted, background: C.card, border: `1px solid ${C.rule}`,
                    borderRadius: 3, cursor: "pointer",
                  }}
                >
                  취소
                </button>
                <button
                  type="button"
                  onClick={() => {
                    const now = new Date();
                    const stamp = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")} ${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;

                        `실제 운영 시 사용기간 종료 2개월 전 자동 발송됩니다.`

                    padding: "9px 24px", fontSize: 13.5, fontFamily: "inherit", fontWeight: 700,
                    color: "#fff", background: "#8A6D2F", border: "none", borderRadius: 3, cursor: "pointer",
                  }}

                  안내 메일 발송

              </div>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

              border: `1px solid ${C.rule}`,
              borderRadius: 3,
              cursor: "pointer",
            }}
          >

          </button>
        </div>

        {myRows.length === 0 && (
          <p
            style={{
              fontSize: 13,
              color: C.muted,
              padding: "40px 20px",
              background: C.card,
              border: `1px dashed ${C.rule}`,
              borderRadius: 3,
              textAlign: "center",

            접수하신 신청 건이 없습니다.
          </p>
        )}

        {/* 신청 카드 목록 */}
        <div style={{ display: "grid", gap: 12 }}>
          {myRows.map((r) => {
            const st = STATUS[r.status];
            const pg = PROGRAMS.find((x) => x.id === r.program);
            const p = calcPeriod(r.reviewYM);
            const granted = GRANTED.includes(r.status);
            const rem = p && granted && !r.reportDate ? remainLabel(p.endDate) : null;
            const open = openId === r.id;

            return (
              <div
                key={r.id}
                style={{
                  background: C.card,
                  border: `1px solid ${C.rule}`,
                  borderLeft: `4px solid ${pg ? pg.color : C.rule}`,

                  overflow: "hidden",

                <div style={{ padding: "16px 18px" }}>
                  <div
                    style={{
                      display: "flex",
                      alignItems: "center",
                      gap: 8,
                      flexWrap: "wrap",
                      marginBottom: 8,
                    }}
                  >
                    <span
                      style={{
                        fontSize: 11,
                        fontWeight: 600,
                        padding: "2px 8px",
                        borderRadius: 2,
                        background: st.bg,
                        color: st.color,
                      }}
                    >
                      {st.label}
                    </span>
                    {pg && (
                      <span style={{ fontSize: 11.5, color: pg.color, fontWeight: 600 }}>
                        {pg.short}
                      </span>
                    )}
                    <span style={{ fontSize: 11.5, color: C.muted }}>{r.id}</span>
                  </div>

                  <div style={{ fontSize: 16, fontWeight: 700, color: C.ink, marginBottom: 4 }}>
                    {r.ptName}
                    <span style={{ fontSize: 13, fontWeight: 400, color: C.muted, marginLeft: 8 }}>
                      {r.diagnosis}
                    </span>
                  </div>
                  <div style={{ fontSize: 12, color: C.muted }}>
                    {r.hospital} {r.dept}
                  </div>

                  {/* 금액 */}
                  <div
                    style={{
                      display: "flex",
                      gap: 22,
                      flexWrap: "wrap",
                      marginTop: 14,
                      paddingTop: 13,
                      borderTop: `1px solid ${C.rule}`,
                    }}
                  >
                    <div>
                      <div style={{ fontSize: 10.5, color: C.muted, marginBottom: 2 }}>신청금액</div>
                      <div style={{ fontSize: 13.5, fontWeight: 600 }}>
                        {won(r.requestAmount)}원
                      </div>
                    </div>
                    <div>
                      <div style={{ fontSize: 10.5, color: C.muted, marginBottom: 2 }}>
                        지원 결정금액
                      </div>
                      <div
                        style={{
                          fontSize: 13.5,
                          fontWeight: 700,
                          color: r.grantAmount ? C.deep : C.muted,
                        }}
                      >
                        {r.grantAmount ? `${won(r.grantAmount)}원` : "심의 전"}
                      </div>
                    </div>
                    {r.reviewDate && (
                      <div>
                        <div style={{ fontSize: 10.5, color: C.muted, marginBottom: 2 }}>심의일</div>
                        <div style={{ fontSize: 13.5, fontWeight: 600 }}>{r.reviewDate}</div>
                      </div>
                    )}
                  </div>

                  {/* 사용기간 · 제출기한 */}
                  {p && granted && (
                    <div
                      style={{
                        marginTop: 13,
                        padding: "13px 15px",
                        background:
                          rem && rem.tone === "over"
                            ? C.sealSoft
                            : rem && rem.tone === "warn"
                            ? "#FBF3E0"
                            : C.paper,
                        border: `1px solid ${
                          rem && rem.tone === "over"
                            ? C.seal
                            : rem && rem.tone === "warn"
                            ? "#D8C08A"
                            : C.rule
                        }`,
                        borderRadius: 3,
                      }}
                    >
                      <div
                        style={{
                          display: "flex",
                          justifyContent: "space-between",
                          alignItems: "center",
                          gap: 10,
                          flexWrap: "wrap",
                        }}
                      >
                        <div>
                          <div style={{ fontSize: 10.5, color: C.muted, marginBottom: 3 }}>
                            지원금 사용기간 · 결과보고서 제출기한
                          </div>
                          <div style={{ fontSize: 13.5, fontWeight: 700, color: C.ink }}>
                            {p.start} ~ {p.end}
                          </div>
                        </div>
                        {r.reportDate ? (
                          <span
                            style={{
                              fontSize: 11.5,
                              fontWeight: 700,
                              padding: "4px 10px",
                              borderRadius: 2,
                              background: C.okSoft,
                              color: C.ok,
                            }}
                          >
                            제출 완료 {r.reportDate}
                          </span>
                        ) : (
                          rem && (
                            <span
                              style={{
                                fontSize: 13,
                                fontWeight: 700,
                                padding: "5px 12px",
                                borderRadius: 2,
                                background:
                                  rem.tone === "over" ? C.seal : rem.tone === "warn" ? "#8A6D2F" : C.deep,
                                color: "#fff",
                              }}
                            >
                              {rem.tone === "over" ? `기한 ${rem.text}` : rem.text}
                            </span>
                          )
                        )}
                      </div>

                      {rem && rem.tone === "warn" && !r.reportDate && (
                        <div style={{ fontSize: 11.5, color: "#8A6D2F", marginTop: 8, lineHeight: 1.6 }}>
                          제출 기한이 한 달 이내입니다. 기한 연장이 필요하시면 연장계획서를
                          제출해주세요.
                        </div>
                      )}
                      {rem && rem.tone === "over" && !r.reportDate && (
                        <div style={{ fontSize: 11.5, color: C.seal, marginTop: 8, lineHeight: 1.6 }}>
                          제출 기한이 지났습니다. 국내사업팀(02-727-2485)으로 문의해주세요.
                        </div>
                      )}
                    </div>
                  )}

                  {/* 심의 전 안내 */}
                  {!granted && r.status !== "rejected" && (
                    <div
                      style={{
                        marginTop: 13,
                        padding: "11px 14px",
                        background: C.paper,
                        border: `1px solid ${C.rule}`,
                        borderRadius: 3,
                        fontSize: 12,
                        color: C.muted,
                        lineHeight: 1.6,
                      }}
                    >
                      심의는 매월 진행되며, 결과가 확정되면 개별 안내드립니다.
                    </div>
                  )}

                  {/* 부결 — 사유는 비공개 */}
                  {r.status === "rejected" && (
                    <div
                      style={{
                        marginTop: 13,
                        padding: "11px 14px",
                        background: C.sealSoft,
                        border: `1px solid ${C.rule}`,
                        borderRadius: 3,
                        fontSize: 12,
                        color: C.seal,
                        lineHeight: 1.6,
                      }}
                    >
                      심의 결과 이번 회차에는 선정되지 않았습니다. 자세한 사항은
                      국내사업팀(02-727-2485)으로 문의해주세요.
                    </div>
                  )}
                </div>

                {/* 상세 토글 */}
                <button
                  type="button"
                  onClick={() => setOpenId(open ? null : r.id)}
                  style={{
                    width: "100%",
                    padding: "9px 0",
                    fontSize: 12,
                    fontFamily: "inherit",
                    fontWeight: 600,
                    color: C.muted,
                    background: C.paper,
                    border: "none",
                    borderTop: `1px solid ${C.rule}`,
                    cursor: "pointer",
                  }}
                >
                  {open ? "접기 ▲" : "상세 보기 ▼"}
                </button>

                {open && (
                  <div
                    style={{
                      padding: "16px 18px",
                      background: C.paper,
                      borderTop: `1px solid ${C.rule}`,
                    }}
                  >
                    <div
                      style={{
                        display: "grid",
                        gridTemplateColumns: "repeat(auto-fit,minmax(140px,1fr))",
                        gap: 12,
                      }}
                    >
                      {[
                        ["성별", r.gender],
                        ["생년월일", r.birth],
                        ["진료과", r.dept],
                        ["접수번호", r.id],
                        ["초상 공개 동의", r.portraitOK ? "동의" : "미동의"],
                        ["결과보고서", r.reportDate || "미제출"],
                      ].map(([k, v]) => (
                        <div key={k}>
                          <div style={{ fontSize: 10.5, color: C.muted, marginBottom: 2 }}>{k}</div>
                          <div style={{ fontSize: 12.5, fontWeight: 500, color: C.ink }}>
                            {v || "—"}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>

        {myRows.length > 0 && (
          <p style={{ fontSize: 11.5, color: C.muted, lineHeight: 1.7, marginTop: 20 }}>
            · 결과보고서 제출기한은 지원금 사용기간 종료일과 같습니다.
            <br />· 기한 내 제출이 어려운 경우 <strong>연장계획서 제출</strong> 탭에서 중간보고 및
            연장계획서를 제출해주세요.
          </p>
        )}
      </main>
    </div>
  );
}

                  </div>
                )}
              </div>
            </div>
  );
}


/* ============================================================

const DEMO_MEMBERS = [
  { id: "member1", pw: "1234", name: "김도현", role: "심의위원" },
  { id: "member2", pw: "1234", name: "박서연", role: "심의위원" },
];

const manwon = (n) => `${(Number(n) / 10000).toLocaleString("ko-KR")}만원`;

function CommitteePage({ rows, setRows }) {
  const [member, setMember] = useState(null);
  const [form, setForm] = useState({ id: "", pw: "" });
  const [loginError, setLoginError] = useState("");
  const [openId, setOpenId] = useState(null);
  const [session, setSession] = useState("2026-07");
  const [docTab, setDocTab] = useState({});

  const font = "'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif";

  const login = () => {
    const found = DEMO_MEMBERS.find(
      (m) => m.id === form.id.trim() && m.pw === form.pw.trim()
    );
    if (found) {
      setMember(found);
      setLoginError("");
    } else {
      setLoginError("아이디 또는 비밀번호가 올바르지 않습니다.");
    }
  };

  /* 접수 상태 건만, 해당 회차 기준 */
  const targets = rows
    .filter((r) => {
      if (r.status !== "received") return false;
      if (!r.submittedAt) return true;
      return r.submittedAt.slice(0, 7) === session;
    })
    .sort(byProgram);

  const totalRequest = targets.reduce((s, r) => s + (Number(r.requestAmount) || 0), 0);
  const decided = targets.filter((r) => r.grantAmount).length;

  /* 심의위원 의견 저장 */
  const vote = (rowId, value) => {
    if (!member) return;
    setRows((s) =>
      s.map((r) => {
        if (r.id !== rowId) return r;
        const votes = { ...(r.votes || {}) };
        if (votes[member.id] === value) delete votes[member.id];
        else votes[member.id] = value;
        return { ...r, votes };
      })
    );
  };

  const voteCount = (r) => {
    const v = r.votes || {};
    const vals = Object.values(v);
    return {
      fit: vals.filter((x) => x === "fit").length,
      unfit: vals.filter((x) => x === "unfit").length,
      mine: member ? v[member.id] : null,
    };
  };

  /* --- 로그인 --- */
  if (!member) {
    return (
      <main style={{ maxWidth: 460, margin: "0 auto", padding: "50px 24px", fontFamily: font }}>
        <div
          style={{
            background: C.card,
            border: `1px solid ${C.rule}`,
            borderTop: `4px solid ${C.deep}`,
            borderRadius: 4,
            padding: "32px 30px",
          }}
        >
          <h2 style={{ fontSize: 19, fontWeight: 700, margin: "0 0 8px", color: C.ink }}>
            심의위원 로그인
          </h2>
          <p style={{ fontSize: 13, color: C.muted, lineHeight: 1.7, margin: "0 0 24px" }}>
            이번 회차 심의 자료를 확인하고, 심의회의에서 결정된 지원금액의 적합 여부를
            체크하실 수 있습니다.
          </p>
          <div style={{ display: "grid", gap: 14 }}>
            <Field label="아이디" required>
              <Input
                value={form.id}
                onChange={(e) => setForm((s) => ({ ...s, id: e.target.value }))}
                onKeyDown={(e) => e.key === "Enter" && login()}
              />
            </Field>
            <Field label="비밀번호" required>
              <Input
                type="password"
                value={form.pw}
                onChange={(e) => setForm((s) => ({ ...s, pw: e.target.value }))}
                onKeyDown={(e) => e.key === "Enter" && login()}
              />
            </Field>
          </div>
          {loginError && (
            <div style={{ fontSize: 12, color: C.seal, marginTop: 10 }}>{loginError}</div>
          )}
          <button
            type="button"
            onClick={login}
            style={{
              width: "100%",
              marginTop: 20,
              padding: "11px 0",
              fontSize: 14,
              fontWeight: 700,
              fontFamily: "inherit",
              color: "#fff",
              background: C.deep,
              border: "none",
              borderRadius: 3,
              cursor: "pointer",
            }}
          >
            로그인
          </button>
          <div
            style={{
              marginTop: 18,
              padding: "12px 14px",
              background: C.paper,
              border: `1px dashed ${C.rule}`,
              borderRadius: 3,
              fontSize: 11.5,
              lineHeight: 1.7,
              color: C.muted,
            }}
          >
            <strong style={{ color: C.ink }}>데모 계정</strong>
            <br />
            member1 / 1234 — 김도현
            <br />
            member2 / 1234 — 박서연
          </div>
        </div>
      </main>
    );
  }

  /* --- 심의 자료 --- */

        {/* 헤더 */}
        <div
          style={{
            display: "flex",
            alignItems: "center",
            justifyContent: "space-between",
            gap: 12,
            flexWrap: "wrap",
            padding: "14px 16px",
            background: C.deepSoft,
            border: `1px solid ${C.rule}`,
            borderRadius: 3,
            marginBottom: 18,
          }}
        >
          <div>
            <div style={{ fontSize: 15, fontWeight: 700, color: C.ink }}>
              {member.name}
              <span style={{ fontSize: 12, fontWeight: 400, color: C.muted, marginLeft: 8 }}>
                {member.role}
              </span>
            </div>
            <div style={{ fontSize: 12, color: C.muted, marginTop: 3 }}>
              심의 자료 확인 및 적합성 검토
            </div>
          </div>
          <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
            <Input

              value={session}

              style={{ width: 150, padding: "6px 9px", fontSize: 13 }}
            />
            <button
              type="button"
              onClick={() => window.print()}
              style={{
                padding: "7px 14px",
                fontSize: 12,
                fontFamily: "inherit",
                fontWeight: 600,
                color: C.deep,
                background: C.card,
                border: `1px solid ${C.deep}`,
                borderRadius: 3,
                cursor: "pointer",
              }}
            >
              인쇄
            </button>
            <button
              type="button"
              onClick={() => {
                setMember(null);
                setForm({ id: "", pw: "" });
              }}
              style={{
                padding: "7px 14px",
                fontSize: 12,
                fontFamily: "inherit",
                fontWeight: 600,
                color: C.muted,
                background: C.card,
                border: `1px solid ${C.rule}`,
                borderRadius: 3,
                cursor: "pointer",
              }}
            >
              로그아웃
            </button>
          </div>
        </div>

        {/* 회차 요약 */}
        <div
          style={{
            display: "grid",
            gridTemplateColumns: "repeat(auto-fit,minmax(140px,1fr))",
            gap: 10,
            marginBottom: 20,
          }}
        >
          <div style={{ padding: "13px 15px", background: C.deep, borderRadius: 3, color: "#fff" }}>
            <div style={{ fontSize: 10.5, opacity: 0.8, marginBottom: 3 }}>심의 회차</div>
            <div style={{ fontSize: 17, fontWeight: 700 }}>
              {session.replace("-", "년 ")}월
            </div>
          </div>
          <div style={{ padding: "13px 15px", background: C.card, border: `1px solid ${C.rule}`, borderRadius: 3 }}>
            <div style={{ fontSize: 10.5, color: C.muted, marginBottom: 3 }}>심의 대상</div>
            <div style={{ fontSize: 17, fontWeight: 700, color: C.ink }}>{targets.length}건</div>
          </div>
          <div style={{ padding: "13px 15px", background: C.card, border: `1px solid ${C.rule}`, borderRadius: 3 }}>

        {targets.length === 0 && (
          <p

              color: C.muted,

              border: `1px dashed ${C.rule}`,
              borderRadius: 3,
              textAlign: "center",
            }}
          >

        {/* 심의 대상 카드 */}
        <div style={{ display: "grid", gap: 14 }}>

            return (
              <React.Fragment key={r.id}>
              {newGroup && pg && (
                <div
                  style={{
                    display: "flex",
                    alignItems: "center",
                    gap: 9,
                    paddingBottom: 6,
                    marginTop: idx === 0 ? 0 : 10,
                    borderBottom: `2px solid ${pg.color}`,

                >
                  <span
                    style={{
                      fontSize: 11,

                      padding: "3px 9px",

                      color: "#fff",

                  <span style={{ fontSize: 13, fontWeight: 700, color: C.ink }}>{pg.label}</span>
                  <span style={{ fontSize: 11.5, color: C.muted, marginLeft: "auto" }}>
                    {groupCount}건

              <div

                  border: `1px solid ${C.rule}`,

                  <div style={{ fontSize: 13.5, color: C.ink, marginTop: 5 }}>
